                                            <span className="text-[0.65rem] font-black uppercase text-slate-500 block">Harga</span>
                                            <span className="font-black text-slate-800">
                                                {selectedInfoSpace.price ? `Rp ${selectedInfoSpace.price.toLocaleString('id-ID')}` : '-'}
                                            </span>
                                        </div>
                                        <div className="bg-slate-50 border border-slate-200 rounded-lg p-3">
                                            <span className="text-[0.65rem] font-black uppercase text-slate-500 block">Sewa Saat Ini</span>
                                            <span className="font-black text-red-700">
                                                {isOwnable(selectedInfoSpace) ? `Rp ${getRentForSpace(selectedInfoSpace).toLocaleString('id-ID')}` : '-'}
                                            </span>
                                        </div>
                                        <div className="bg-slate-50 border border-slate-200 rounded-lg p-3">
                                            <span className="text-[0.65rem] font-black uppercase text-slate-500 block">Level</span>
                                            <span className="font-black text-emerald-700">
                                                {selectedInfoSpace.type === 'property' ? selectedInfoSpace.hotel ? 'Hotel' : `${selectedInfoSpace.houses || 0} Rumah` : ['port', 'utility'].includes(selectedInfoSpace.type) ? `Level ${selectedInfoSpace.upgradeLevel || 0}` : '-'}
                                            </span>
                                        </div>
                                    </div>

                                    {selectedInfoSpace.type === 'property' && (
                                        <div className="bg-red-50/50 rounded-lg p-3 border border-red-100 mb-4">
                                            <span className="text-[0.65rem] uppercase font-black text-red-800 block mb-2 text-center border-b border-red-200 pb-1">Daftar Harga Sewa Bertingkat</span>
                                            <div className="grid grid-cols-2 gap-x-4 gap-y-1">
                                                <div className="flex justify-between"><span className="text-xs font-bold text-gray-600">Tanah Kosong</span><span className="text-xs font-black text-red-600">Rp {selectedInfoSpace.rent.toLocaleString('id-ID')}</span></div>
                                                <div className="flex justify-between"><span className="text-xs font-bold text-gray-600">1 Rumah</span><span className="text-xs font-black text-red-600">Rp {(selectedInfoSpace.rent * 3).toLocaleString('id-ID')}</span></div>
                                                <div className="flex justify-between"><span className="text-xs font-bold text-gray-600">2 Rumah</span><span className="text-xs font-black text-red-600">Rp {(selectedInfoSpace.rent * 7).toLocaleString('id-ID')}</span></div>
                                                <div className="flex justify-between"><span className="text-xs font-bold text-gray-600">3 Rumah</span><span className="text-xs font-black text-red-600">Rp {(selectedInfoSpace.rent * 14).toLocaleString('id-ID')}</span></div>
                                                <div className="flex justify-between"><span className="text-xs font-bold text-gray-600">4 Rumah</span><span className="text-xs font-black text-red-600">Rp {(selectedInfoSpace.rent * 24).toLocaleString('id-ID')}</span></div>
                                                <div className="flex justify-between"><span className="text-xs font-bold text-gray-600">Hotel</span><span className="text-xs font-black text-red-600">Rp {(selectedInfoSpace.rent * 40).toLocaleString('id-ID')}</span></div>
                                            </div>
                                        </div>
                                    )}

                                    {selectedInfoSpace.type === 'property' && (
                                        <div className="bg-emerald-50 rounded-lg p-3 border border-emerald-100 mb-4">
                                            <span className="text-[0.65rem] uppercase font-black text-emerald-800 block mb-2 text-center border-b border-emerald-200 pb-1">Biaya Upgrade Bertingkat</span>
                                            <div className="grid grid-cols-2 gap-x-4 gap-y-1">
                                                {BUILD_COST_RATES.map((rate, index) => (
                                                    <div key={index} className="flex justify-between">
                                                        <span className="text-xs font-bold text-gray-600">{index >= 4 ? 'Hotel' : `${index + 1} Rumah`}</span>
                                                        <span className="text-xs font-black text-emerald-700">Rp {Math.max(5000, Math.round((selectedInfoSpace.price * rate) / 1000) * 1000).toLocaleString('id-ID')}</span>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    )}

                                    {selectedInfoSpace.type === 'utility' && (
                                        <div className="bg-blue-50 rounded-lg p-3 border border-blue-100 mb-4">
                                            <span className="text-[0.65rem] uppercase font-black text-blue-800 block mb-2 text-center border-b border-blue-200 pb-1">Aturan Utilitas</span>
                                            <div className="space-y-1">
                                                <div className="flex justify-between"><span className="text-xs font-bold text-gray-600">1 utility Lv 0</span><span className="text-xs font-black text-blue-700">Dadu x 400</span></div>
                                                <div className="flex justify-between"><span className="text-xs font-bold text-gray-600">1 utility Lv 1</span><span className="text-xs font-black text-blue-700">Dadu x 600</span></div>
                                                <div className="flex justify-between"><span className="text-xs font-bold text-gray-600">1 utility Lv 2</span><span className="text-xs font-black text-blue-700">Dadu x 800</span></div>
                                                <div className="flex justify-between"><span className="text-xs font-bold text-gray-600">1 utility Lv 3</span><span className="text-xs font-black text-blue-700">Dadu x 1.000</span></div>
                                                <div className="border-t border-blue-200 pt-1 mt-1 text-[0.68rem] font-bold text-blue-900">Jika punya PLN + PDAM: level total 0-1 x1.000, level total 2-3 x1.300, level total 4-5 x1.600, level total 6 x2.000.</div>
                                            </div>
                                        </div>
                                    )}

                                    {selectedInfoSpace.type === 'port' && (
                                        <div className="bg-indigo-50 rounded-lg p-3 border border-indigo-100 mb-4">
                                            <span className="text-[0.65rem] uppercase font-black text-indigo-800 block mb-2 text-center border-b border-indigo-200 pb-1">Aturan Transportasi</span>
	                                            <div className="space-y-1">
	                                                <div className="flex justify-between"><span className="text-xs font-bold text-gray-600">Sewa koleksi</span><span className="text-xs font-black text-indigo-700">Rp 2.500 x jumlah port</span></div>
	                                                <div className="flex justify-between"><span className="text-xs font-bold text-gray-600">Lv 1 Loket Premium</span><span className="text-xs font-black text-indigo-700">x2 sewa koleksi</span></div>
	                                                <div className="flex justify-between"><span className="text-xs font-bold text-gray-600">Lv 2 Terminal Besar</span><span className="text-xs font-black text-indigo-700">x3 sewa koleksi</span></div>
	                                                <div className="flex justify-between"><span className="text-xs font-bold text-gray-600">Lv 3 Hub Internasional</span><span className="text-xs font-black text-indigo-700">x4 sewa koleksi</span></div>
	                                            </div>
	                                        </div>
	                                    )}

                                    {['utility', 'port'].includes(selectedInfoSpace.type) && (
                                        <div className="bg-emerald-50 rounded-lg p-3 border border-emerald-100 mb-4">
                                            <span className="text-[0.65rem] uppercase font-black text-emerald-800 block mb-2 text-center border-b border-emerald-200 pb-1">Biaya Upgrade Level</span>
                                            <div className="grid grid-cols-1 gap-y-1">
                                                {(selectedInfoSpace.type === 'utility' ? UTILITY_UPGRADE_COSTS : PORT_UPGRADE_COSTS).map((cost, index) => (
                                                    <div key={index} className="flex justify-between">
                                                        <span className="text-xs font-bold text-gray-600">Level {index + 1}</span>
                                                        <span className="text-xs font-black text-emerald-700">Rp {cost.toLocaleString('id-ID')}</span>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    )}

                                    {isOwnable(selectedInfoSpace) && (
                                        <div className="border border-emerald-200 bg-emerald-50 rounded-xl p-4">
                                            <div className="flex items-center justify-between gap-3 mb-3">
                                                <div>
                                                    <span className="text-xs font-black uppercase text-emerald-700">Upgrade Aset</span>
                                                    <p className="text-xs text-emerald-900 font-semibold">
                                                        Biaya {getNextBuildLabel(selectedInfoSpace)}: {getBuildCost(selectedInfoSpace) === null ? 'Selesai' : `Rp ${getBuildCost(selectedInfoSpace).toLocaleString('id-ID')}`}
                                                    </p>
                                                </div>
                                                <span className="text-xs font-black bg-white text-emerald-700 border border-emerald-200 rounded-full px-2 py-1">
                                                    Sewa saat ini Rp {getRentForSpace(selectedInfoSpace).toLocaleString('id-ID')}
                                                </span>
                                            </div>

                                            {selectedInfoSpace.owner === currentPlayer.id ? (
                                                <div>
                                                    <button
                                                        onClick={() => upgradeProperty(selectedInfoSpace.id)}
                                                        disabled={!canBuildOnSpace(selectedInfoSpace)}
                                                        className={`w-full py-3 rounded-lg font-black shadow transition-all ${!canBuildOnSpace(selectedInfoSpace) ? 'bg-gray-300 text-gray-500 cursor-not-allowed' : 'bg-emerald-600 hover:bg-emerald-700 text-white hover:-translate-y-0.5'}`}
                                                    >
                                                        {getBuildCost(selectedInfoSpace) === null ? 'Upgrade Maksimal' : `Upgrade ${getNextBuildLabel(selectedInfoSpace)}`}
                                                    </button>
                                                    {currentPlayer.position !== selectedInfoSpace.id && getBuildCost(selectedInfoSpace) !== null && (
                                                        <p className="text-xs text-emerald-900 font-bold bg-white border border-emerald-100 rounded-lg p-3 mt-3">
                                                            Pemilik harus mendarat di petak ini lagi untuk membangun level berikutnya.
                                                        </p>
                                                    )}
                                                    {currentPlayer.position === selectedInfoSpace.id && !buildPermissions[getBuildPermissionKey(currentPlayer.id, selectedInfoSpace.id)] && getBuildCost(selectedInfoSpace) !== null && (
                                                        <p className="text-xs text-emerald-900 font-bold bg-white border border-emerald-100 rounded-lg p-3 mt-3">
                                                            Izin bangun untuk kunjungan ini belum tersedia atau sudah dipakai. Mendarat lagi di petak ini untuk upgrade berikutnya.
                                                        </p>
                                                    )}
                                                    {currentPlayer.position === selectedInfoSpace.id && getBuildCost(selectedInfoSpace) !== null && currentPlayer.money < getBuildCost(selectedInfoSpace) && (
                                                        <p className="text-xs text-red-700 font-bold bg-white border border-red-100 rounded-lg p-3 mt-3">
                                                            Saldo belum cukup untuk upgrade di petak ini.
                                                        </p>
                                                    )}
                                                </div>
                                            ) : (
                                                <p className="text-xs text-emerald-900 font-bold bg-white border border-emerald-100 rounded-lg p-3">
                                                    Hanya pemilik aset yang sedang berdiri di petak ini yang bisa upgrade.
                                                </p>
                                            )}
	                                        </div>
	                                    )}

	                                    {isOwnable(selectedInfoSpace) && selectedInfoSpace.owner !== undefined && selectedInfoSpace.owner !== currentPlayer.id && canTakeAction && (
	                                        <div className="border border-indigo-200 bg-indigo-50 rounded-xl p-4 mt-3">
	                                            <div className="mb-3">
	                                                <span className="text-xs font-black uppercase text-indigo-700">Tawar Beli Aset</span>
	                                                <p className="text-xs text-indigo-900 font-semibold">
	                                                    Tawar {selectedInfoSpace.name} milik {players[selectedInfoSpace.owner]?.name}. Pemilik aset harus menyetujui dulu.
	                                                </p>
	                                            </div>
	                                            {tradeOffer ? (
	                                                <p className="text-xs text-indigo-900 font-bold bg-white border border-indigo-100 rounded-lg p-3">
	                                                    Masih ada tawaran yang sedang menunggu jawaban.
	                                                </p>
	                                            ) : (
	                                                <div className="flex flex-col gap-2">
	                                                    {players[selectedInfoSpace.owner]?.isBot && (
	                                                        <p className="text-xs text-indigo-900 font-bold bg-white border border-indigo-100 rounded-lg p-3">
	                                                            Bot akan otomatis menerima jika tawaran memenuhi nilai minimum aset.
	                                                        </p>
	                                                    )}
	                                                    <input
	                                                        type="number"
	                                                        min="1"
	                                                        step="1000"
	                                                        value={tradeOfferAmount}
	                                                        onChange={(event) => setTradeOfferAmount(event.target.value)}
	                                                        placeholder="Nominal tawaran"
	                                                        className="w-full rounded-lg border border-indigo-200 bg-white px-3 py-2 font-black text-indigo-950 outline-none focus:border-indigo-500"
	                                                    />
	                                                    <button onClick={() => createTradeOffer(selectedInfoSpace)} className="w-full py-3 bg-indigo-700 hover:bg-indigo-800 text-white rounded-lg font-black shadow">
	                                                        Kirim Tawaran
	                                                    </button>
	                                                </div>
	                                            )}
	                                        </div>
	                                    )}

		                                    {selectedInfoSpace.owner === (myPlayerInfo?.id ?? currentPlayer.id) && !(myPlayerInfo?.isBot ?? currentPlayer.isBot) && (!isOnline || canTakeAction) && (
	                                        <div className="border border-slate-200 bg-slate-100 rounded-xl p-4 mt-3">
                                            <div className="mb-3">
                                                <span className="text-xs font-black uppercase text-slate-700">Manajemen Aset</span>
                                                <p className="text-xs text-slate-600 font-semibold">Kelola aset ini (Jual/Gadai) ke Bank secara bebas.</p>
                                            </div>
                                            <div className="flex flex-col gap-2">
                                                {((selectedInfoSpace.type === 'property' && (selectedInfoSpace.hotel || (selectedInfoSpace.houses > 0))) || (['port', 'utility'].includes(selectedInfoSpace.type) && (selectedInfoSpace.upgradeLevel || 0) > 0)) && (
                                                    <button onClick={() => sellOneBuilding(selectedInfoSpace.id)} className="w-full py-2 bg-amber-500 hover:bg-amber-600 text-white rounded-lg font-black shadow flex justify-between px-4 items-center transition-colors">
                                                        <span>Jual {selectedInfoSpace.type === 'property' ? selectedInfoSpace.hotel ? 'Hotel' : 'Rumah' : 'Upgrade'}</span>
                                                        <span>+ Rp {getSellBuildingValue(selectedInfoSpace).toLocaleString('id-ID')}</span>
                                                    </button>
                                                )}
                                                
                                                {isOwnable(selectedInfoSpace) && !selectedInfoSpace.mortgaged && !selectedInfoSpace.hotel && !(selectedInfoSpace.houses > 0) && !(selectedInfoSpace.upgradeLevel > 0) && (
                                                    <button onClick={() => mortgageProperty(selectedInfoSpace.id)} className="w-full py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-black shadow flex justify-between px-4 items-center transition-colors">
                                                        <span>Gadaikan Properti</span>
                                                        <span>+ Rp {getMortgageValue(selectedInfoSpace).toLocaleString('id-ID')}</span>
                                                    </button>
                                                )}

                                                {selectedInfoSpace.mortgaged && (
                                                    <button onClick={() => unmortgageProperty(selectedInfoSpace.id)} className="w-full py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg font-black shadow flex justify-between px-4 items-center transition-colors">
                                                        <span>Tebus Gadai (+Bunga 10%)</span>
                                                        <span>- Rp {getMortgagePayoffCost(selectedInfoSpace).toLocaleString('id-ID')}</span>
                                                    </button>
                                                )}

                                                {isOwnable(selectedInfoSpace) && !selectedInfoSpace.hotel && !(selectedInfoSpace.houses > 0) && !(selectedInfoSpace.upgradeLevel > 0) && (
                                                    <button onClick={() => sellProperty(selectedInfoSpace.id)} className="w-full py-2 bg-red-600 hover:bg-red-700 text-white rounded-lg font-black shadow flex justify-between px-4 items-center transition-colors">
                                                        <span>{selectedInfoSpace.mortgaged ? 'Jual Tanah & Lunasi Gadai' : 'Jual Tanah 100%'}</span>
                                                        <span>{getSellPropertyNetValue(selectedInfoSpace) < 0 ? '-' : '+'} Rp {Math.abs(getSellPropertyNetValue(selectedInfoSpace)).toLocaleString('id-ID')}</span>
                                                    </button>
                                                )}
                                                {selectedInfoSpace.mortgaged && isOwnable(selectedInfoSpace) && !selectedInfoSpace.hotel && !(selectedInfoSpace.houses > 0) && !(selectedInfoSpace.upgradeLevel > 0) && (
                                                    <p className="text-[0.7rem] font-bold text-slate-600 bg-white border border-slate-200 rounded-lg p-2">
                                                        Jual saat tergadai: harga tanah Rp {getSellPropertyValue(selectedInfoSpace).toLocaleString('id-ID')} dipotong pelunasan gadai Rp {getMortgagePayoffCost(selectedInfoSpace).toLocaleString('id-ID')}.
                                                    </p>
                                                )}
                                            </div>
                                        </div>
                                    )}
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
