        // --- 2. SUPABASE CONFIGURATION ---

        // --- 3. HELPER ATURAN PROPERTI & SEWA BERTINGKAT ---
        const getTileCoordinates = (index) => {
            const halfSize = 13.5;
            const step = 2.7;
            if (index <= 10) return { x: halfSize - (index * step), z: halfSize, rotY: 0 };
            if (index <= 20) return { x: -halfSize, z: halfSize - ((index - 10) * step), rotY: Math.PI / 2 };
            if (index <= 30) return { x: -halfSize + ((index - 20) * step), z: -halfSize, rotY: Math.PI };
            return { x: halfSize, z: -halfSize + ((index - 30) * step), rotY: -Math.PI / 2 };
        };

        const isOwnable = (space) => ['property', 'port', 'utility'].includes(space?.type);
        const getBuildCost = (space) => {
            if (!space || space.type !== 'property') return 0;
            return Math.max(5000, Math.round(space.price * 0.6));
        };

            if (!space || space.type !== 'property') return null;
            const base = space.rent || 200;
            return {
                base: base,
                house1: base * 3,
                house2: base * 7,
                house3: base * 14,
                house4: base * 24,
                hotel: base * 40,
                mortgageValue: Math.round(space.price * 0.5),
                unmortgageCost: Math.round(space.price * 0.55),
                buildCost: getBuildCost(space)
            };
        };

        // Buat tekstur petak dinamis
        const createTileTexture = (space) => {
            const canvas = document.createElement('canvas');
            canvas.width = 256; canvas.height = 360;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = "#ffffff"; ctx.fillRect(0, 0, 256, 360);
            ctx.strokeStyle = "#cbd5e1"; ctx.lineWidth = 6; ctx.strokeRect(3, 3, 250, 354);

            if (space.type === 'property' && space.color) {
                ctx.fillStyle = space.color; ctx.fillRect(4, 4, 248, 80);
                ctx.strokeStyle = "rgba(0,0,0,0.3)"; ctx.strokeRect(4, 4, 248, 80);
            } else {
                ctx.fillStyle = "#f1f5f9"; ctx.fillRect(4, 4, 248, 60);
            }

            ctx.fillStyle = "#0f172a"; ctx.font = "bold 24px -apple-system, sans-serif";
            ctx.textAlign = "center"; ctx.textBaseline = "middle";
            const words = space.name.split(" ");
            if (words.length > 1) {
                ctx.fillText(words.slice(0, 2).join(" "), 128, 140);
                if (words.slice(2).join(" ")) ctx.fillText(words.slice(2).join(" "), 128, 172);
            } else {
                ctx.fillText(space.name, 128, 150);
            }

            ctx.font = "38px sans-serif";
            const icons = { go: "🏁", port: "🚢", utility: "⚡", chance: "❓", chest: "🎁", jail: "🔒", gotojail: "🚔", parking: "🅿️", tax: "💰" };
            ctx.fillText(icons[space.type] || "🏖️", 128, 220);

            if (space.price) {
                ctx.fillStyle = "#047857"; ctx.font = "bold 22px sans-serif";
                ctx.fillText(`Rp ${(space.price / 1000)}k`, 128, 310);
            }

            const texture = new THREE.CanvasTexture(canvas);
            texture.anisotropy = 8;
            return texture;
        };

        const createDiceTexture = (number) => {
            const canvas = document.createElement('canvas');
            canvas.width = 128; canvas.height = 128;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = "#f8fafc"; ctx.fillRect(0, 0, 128, 128);
            ctx.strokeStyle = "#cbd5e1"; ctx.lineWidth = 8; ctx.strokeRect(4, 4, 120, 120);

            ctx.fillStyle = number === 1 ? "#dc2626" : "#0f172a";
            const drawDot = (x, y, r = 12) => { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); };
            const c = 64, l = 32, r = 96;
            if (number === 1) drawDot(c, c, 16);
            if (number === 2) { drawDot(l, l); drawDot(r, r); }
            if (number === 3) { drawDot(l, l); drawDot(c, c); drawDot(r, r); }
            if (number === 4) { drawDot(l, l); drawDot(r, l); drawDot(l, r); drawDot(r, r); }
            if (number === 5) { drawDot(l, l); drawDot(r, l); drawDot(c, c); drawDot(l, r); drawDot(r, r); }
            if (number === 6) { drawDot(l, l); drawDot(r, l); drawDot(l, c); drawDot(r, c); drawDot(l, r); drawDot(r, r); }

            return new THREE.CanvasTexture(canvas);
        };

        // --- 4. KOMPONEN UTAMA REACT APLIKASI MONOPOLI 3D ---

            const threeSceneRef = React.useRef(null);

            const remoteUpdateRef = React.useRef(0);

            const myPlayerInfo = players.find(p => p.setupId === mySetupId) || players[0];
            const currentPlayer = players[turnIndex] || players[0] || {};
            const isMyTurn = !isOnline || (myPlayerInfo && myPlayerInfo.id === turnIndex);
            const canTakeAction = isMyTurn && !currentPlayer.isBot && !currentPlayer.bankrupt;

            const addLog = (msg) => {
                setLogs(prev => [msg, ...prev.slice(0, 40)]);
            };

            const triggerMoneyAnimation = (amount, label, route = {}) => {
                if (!amount) return;

                setMoneyEffects(prev => [...prev, { id, amount, label, ...route }]);
                setTimeout(() => {
                    setMoneyEffects(prev => prev.filter(e => e.id !== id));
                }, 1300);
            };

            // Audio setup
            React.useEffect(() => {
                const music = new Audio("Let's%20Get%20Rich%20theme%20song.mp3");
                music.loop = true;
                music.volume = musicVolume;
                backgroundMusicRef.current = music;
                const unlock = () => {
                    music.play().catch(() => {});
                    window.removeEventListener('pointerdown', unlock);
                };
                window.addEventListener('pointerdown', unlock, { once: true });
                return () => {
                    music.pause();
                    backgroundMusicRef.current = null;
                };
            }, []);

            React.useEffect(() => {
                if (backgroundMusicRef.current) {
                    backgroundMusicRef.current.volume = musicVolume;
                    backgroundMusicRef.current.muted = musicVolume === 0;
                }
            }, [musicVolume]);

            const playSoundEffect = (type) => {
                if (isSfxMuted) return;
                try {
                    const ctx = new (window.AudioContext || window.webkitAudioContext)();
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.connect(gain); gain.connect(ctx.destination);
                    if (type === 'dice') {
                        osc.type = 'triangle'; osc.frequency.setValueAtTime(220, ctx.currentTime);
                        osc.frequency.exponentialRampToValueAtTime(110, ctx.currentTime + 0.15);
                        gain.gain.setValueAtTime(0.08, ctx.currentTime);
                        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.15);
                        osc.start(); osc.stop(ctx.currentTime + 0.15);
                    } else if (type === 'hop') {
                        osc.type = 'sine'; osc.frequency.setValueAtTime(450, ctx.currentTime);
                        osc.frequency.exponentialRampToValueAtTime(600, ctx.currentTime + 0.08);
                        gain.gain.setValueAtTime(0.06, ctx.currentTime);
                        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.08);
                        osc.start(); osc.stop(ctx.currentTime + 0.08);

            // --- 5. LOGIKA SUPABASE MULTIPLAYER ---
            const handleLogin = (e) => {

                const username = loginForm.username.trim();
                if (!username) { setSetupError("Username wajib diisi."); return; }
                if (!supabase) { setSetupError("Supabase belum terkonfigurasi!"); return; }
                const newCode = Math.random().toString(36).substring(2, 8).toUpperCase();
                const playerInfo = { setupId: mySetupId, name: username, token: "🏄", color: "#ef4444", isBot: false };
                try {
                    const { error } = await supabase.from('games').insert([{
                        room_code: newCode,
                        status: 'LOBBY',
                        room_name: `Room ${username}`,
                        lobby_players: [playerInfo]
                    }]);
                    if (error) throw error;
                    setRoomCode(newCode); setIsOnline(true); setIsHost(true);
                    setHostName(username); setLobbyPlayers([playerInfo]);
                    saveOnlineSession({ roomCode: newCode, setupId: mySetupId, playerName: username, isHost: true });
                    setScreen('LOBBY'); setSetupError("");
                } catch (err) {
                    setSetupError("Gagal membuat room daring. Cek koneksi.");
                }
            };

            const joinOnlineRoom = async (e) => {
                e.preventDefault();
                const username = loginForm.username.trim();
                const code = joinCode.trim().toUpperCase();
                if (!username || !code) { setSetupError("Username dan Kode Room wajib diisi."); return; }
                if (!supabase) { setSetupError("Supabase belum terhubung!"); return; }
                try {
                    const { data, error } = await supabase.from('games').select('*').eq('room_code', code).single();
                    if (error || !data) throw new Error("Room tidak ditemukan.");
                    if (data.status !== 'LOBBY') throw new Error("Game sudah berjalan.");
                    if (data.lobby_players.length >= 6) throw new Error("Room sudah penuh.");

                    const playerInfo = {
                        setupId: mySetupId,
                        name: username,
                        token: tokenChoices[data.lobby_players.length % tokenChoices.length],
                        color: playerColors[data.lobby_players.length % playerColors.length],
                        isBot: false
                    };
                    const updated = [...data.lobby_players, playerInfo];
                    await supabase.from('games').update({ lobby_players: updated }).eq('room_code', code);
                    setRoomCode(code); setIsOnline(true); setIsHost(false);
                    setHostName(data.lobby_players[0]?.name || "Host");
                    setLobbyPlayers(updated);
                    saveOnlineSession({ roomCode: code, setupId: mySetupId, playerName: username, isHost: false });

                    .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'games', filter: `room_code=eq.${roomCode}` }, (payload) => {
                        const data = payload.new;
                        if (data.status === 'LOBBY' && screen !== 'GAME') {
                            setLobbyPlayers(data.lobby_players || []);
                            setRoomName(data.room_name || "Room Monopoli Bali");
                        } else if (data.status === 'GAME') {
                            if (screen !== 'GAME') setScreen('GAME');

                            if (s.updater === mySetupId) return; // Abaikan echo diri sendiri
                            if (s.revision && s.revision <= gameRevisionRef.current) return;
                            gameRevisionRef.current = s.revision;
                            remoteUpdateRef.current = Date.now();

                            if (s.board) setBoard(s.board);
                            if (s.players) setPlayers(s.players);
                            if (s.turnIndex !== undefined) setTurnIndex(s.turnIndex);
                            if (s.turnPhase) setTurnPhase(s.turnPhase);

                            if (s.totalTurnsCount !== undefined) setTotalTurnsCount(s.totalTurnsCount);
                            if (s.winner !== undefined) setWinner(s.winner);

                    })
                    .subscribe();

                return () => { supabase.removeChannel(channel); };

                        turnPhase, freeParkingPot, logs, currentRoll, touristSeasonTurns,

                }, 300);

            // --- 6. INISIALISASI TAMPILAN THREE.JS & RAYCASTER INTERAKTIF ---
            React.useEffect(() => {
                if (screen !== 'GAME') return;

                const dirLight = new THREE.DirectionalLight(0xfffaf0, 1.35);
                dirLight.position.set(22, 45, 22);
                dirLight.castShadow = true;
                dirLight.shadow.mapSize.width = 2048;
                dirLight.shadow.mapSize.height = 2048;

                scene.add(dirLight);

                const fillLight = new THREE.DirectionalLight(0x60a5fa, 0.35);
                fillLight.position.set(-20, 20, -20);
                scene.add(fillLight);

                // Meja Kayu Tropis
                const tableMesh = new THREE.Mesh(new THREE.PlaneGeometry(160, 160), new THREE.MeshStandardMaterial({ color: 0x050811, roughness: 0.9 }));
                tableMesh.rotation.x = -Math.PI / 2;

                const baseMesh = new THREE.Mesh(new THREE.BoxGeometry(32, 1.4, 32), new THREE.MeshStandardMaterial({ color: 0x1f1610, roughness: 0.4, metalness: 0.1 }));
                baseMesh.position.y = 0.7;
                baseMesh.receiveShadow = true;
                baseMesh.castShadow = true;
                boardGroup.add(baseMesh);

                // Trim Emas Pinggir Papan
                const trimMesh = new THREE.Mesh(new THREE.BoxGeometry(32.4, 0.15, 32.4), new THREE.MeshStandardMaterial({ color: 0xd97706, roughness: 0.2, metalness: 0.85 }));
                trimMesh.position.y = 1.42;
                boardGroup.add(trimMesh);

                // Gambar Tengah Papan (Center Art Bali)
                new THREE.TextureLoader().load("Gemini_Generated_Image_djzwuldjzwuldjzw.png", (tex) => {
                    const centerMesh = new THREE.Mesh(new THREE.PlaneGeometry(21.4, 21.4), new THREE.MeshStandardMaterial({ map: tex, roughness: 0.5 }));
                    centerMesh.rotation.x = -Math.PI / 2;
                    centerMesh.position.y = 1.44;

                });

                // Generate 40 Petak 3D di Papan
                boardData.forEach((space) => {
                    const coords = getTileCoordinates(space.id);
                    const isCorner = [0, 10, 20, 30].includes(space.id);
                    const tileGeo = new THREE.BoxGeometry(isCorner ? 3.4 : 2.5, 0.18, isCorner ? 3.4 : 4.4);

                    const materials = [

                    ];
                    const tileMesh = new THREE.Mesh(tileGeo, materials);

                scene.add(boardGroup);

                // Dadu 3D Fisik
                const diceGroup = new THREE.Group();

                for (let i = 0; i < 2; i++) {

                        new THREE.MeshStandardMaterial({ map: createDiceTexture(5), roughness: 0.2 }),

                    ];
                    const die = new THREE.Mesh(dGeo, materials);
                    die.castShadow = true;
                    die.position.set(i === 0 ? -1.8 : 1.8, 2.3, 0);
                    diceGroup.add(die);
                }
                scene.add(diceGroup);
                diceMeshesRef.current = diceGroup.children;

                // Bidak / Pion 3D Pemain
                const playerGroup = new THREE.Group();
                playerMeshesRef.current = {};
                players.forEach((p, idx) => {
                    const pMesh = createPlayerPawnMesh(p.color, p.token);
                    const coords = getTileCoordinates(p.position || 0);
                    const offsetX = (idx % 2 === 0 ? -0.4 : 0.4);
                    const offsetZ = (idx > 1 ? -0.4 : 0.4);
                    pMesh.position.set(coords.x + offsetX, 1.6, coords.z + offsetZ);
                    playerGroup.add(pMesh);
                    playerMeshesRef.current[p.id] = pMesh;
                });
                scene.add(playerGroup);

                // Group Bangunan 3D (Rumah & Hotel)
                const buildingsGroup = new THREE.Group();
                scene.add(buildingsGroup);
                buildingMeshesRef.current = buildingsGroup;

                threeSceneRef.current = { scene, camera, renderer, controls };

                // Raycaster untuk Klik Petak 3D Melihat Informasi Detail Wilayah
                const raycaster = new THREE.Raycaster();
                const mouse = new THREE.Vector2();
                let pointerDownPos = { x: 0, y: 0 };

                renderer.domElement.addEventListener('pointerdown', (e) => {
                    pointerDownPos = { x: e.clientX, y: e.clientY };
                });

                renderer.domElement.addEventListener('pointerup', (e) => {
                    // Cegah klik jika pemain sedang men-drag / memutar kamera
                    const dist = Math.hypot(e.clientX - pointerDownPos.x, e.clientY - pointerDownPos.y);
                    if (dist > 6) return;

                    const rect = renderer.domElement.getBoundingClientRect();
                    mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
                    mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;

                    raycaster.setFromCamera(mouse, camera);
                    const intersects = raycaster.intersectObjects(boardGroup.children, true);
                    for (let hit of intersects) {
                        let obj = hit.object;
                        if (obj && typeof obj.userData?.spaceId === 'number') {
                            setSelectedInfoSpaceId(obj.userData.spaceId);
                            break;
                        }
                    }
                });

                const handleResize = () => {
                    camera.aspect = window.innerWidth / window.innerHeight;
                    camera.updateProjectionMatrix();
                    renderer.setSize(window.innerWidth, window.innerHeight);
                };
                window.addEventListener('resize', handleResize);

                let animId;
                const animate = (time) => {
                    animId = requestAnimationFrame(animate);
                    window.TWEEN.update(time);
                    controls.update();
                    renderer.render(scene, camera);
                };
                animate();

                return () => {
                    cancelAnimationFrame(animId);
                    window.removeEventListener('resize', handleResize);
                    renderer.dispose();
                };
            }, [screen]);

            // Model Pion 3D
            const createPlayerPawnMesh = (colorHex, tokenChar) => {
                const group = new THREE.Group();
                const base = new THREE.Mesh(new THREE.CylinderGeometry(0.7, 0.85, 0.35, 24), new THREE.MeshStandardMaterial({ color: 0xd97706, roughness: 0.25, metalness: 0.85 }));
                base.castShadow = true; group.add(base);

                const bodyMat = new THREE.MeshStandardMaterial({ color: colorHex, roughness: 0.2, metalness: 0.3 });
                const body = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.65, 1.2, 24), bodyMat);
                body.position.y = 0.7; body.castShadow = true; group.add(body);

                const head = new THREE.Mesh(new THREE.SphereGeometry(0.5, 24, 24), bodyMat);
                head.position.y = 1.45; head.castShadow = true; group.add(head);

                const canvas = document.createElement('canvas');
                canvas.width = 128; canvas.height = 128;
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = "rgba(15, 23, 42, 0.85)"; ctx.beginPath(); ctx.arc(64, 64, 58, 0, Math.PI * 2); ctx.fill();
                ctx.strokeStyle = "#f59e0b"; ctx.lineWidth = 8; ctx.stroke();
                ctx.font = "64px sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
                ctx.fillText(tokenChar, 64, 70);

                const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(canvas) }));
                sprite.position.y = 2.4; sprite.scale.set(1.4, 1.4, 1.4);
                group.add(sprite);

                return group;
            };

            // Update Miniatur Bangunan 3D Rumah Hijau & Hotel Merah di atas Petak Papan
            React.useEffect(() => {
                if (screen !== 'GAME' || !buildingMeshesRef.current) return;
                const group = buildingMeshesRef.current;
                while (group.children.length > 0) { group.remove(group.children[0]); }

                board.forEach(space => {
                    if (space.type === 'property' && (space.houses > 0 || space.hotel)) {
                        const coords = getTileCoordinates(space.id);
                        if (space.hotel) {
                            // Model 3D Hotel Merah Megah (Menara Meru)
                            const hGroup = new THREE.Group();
                            const bMesh = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.8, 0.8), new THREE.MeshStandardMaterial({ color: 0xdc2626, roughness: 0.3 }));
                            bMesh.position.y = 0.4;
                            hGroup.add(bMesh);
                            const rMesh = new THREE.Mesh(new THREE.ConeGeometry(0.9, 0.7, 4), new THREE.MeshStandardMaterial({ color: 0xf59e0b, roughness: 0.2 }));
                            rMesh.position.y = 1.15; rMesh.rotation.y = Math.PI / 4;
                            hGroup.add(rMesh);

                            hGroup.position.set(coords.x, 1.6, coords.z);
                            group.add(hGroup);
                        } else {
                            // Model 3D Rumah Hijau Asri (Mini Villa)
                            for (let h = 0; h < space.houses; h++) {
                                const houseGroup = new THREE.Group();
                                const body = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.4, 0.5), new THREE.MeshStandardMaterial({ color: 0x10b981, roughness: 0.3 }));
                                body.position.y = 0.2; houseGroup.add(body);
                                const roof = new THREE.Mesh(new THREE.ConeGeometry(0.42, 0.35, 4), new THREE.MeshStandardMaterial({ color: 0x064e3b, roughness: 0.4 }));
                                roof.position.y = 0.55; roof.rotation.y = Math.PI / 4; houseGroup.add(roof);

                                const offset = (h - (space.houses - 1) / 2) * 0.6;
                                houseGroup.position.set(coords.x + offset, 1.6, coords.z);
                                group.add(houseGroup);
                            }
                        }
                    }
                });
            }, [board, screen]);

            // Animasi Lempar Dadu 3D
            const roll3DDice = (d1, d2, onComplete) => {
                const dice = diceMeshesRef.current;
                if (!dice || dice.length < 2) { onComplete(); return; }
                setIsRolling(true); playSoundEffect('dice');

                const faceRotations = {
                    1: { x: 0, z: Math.PI / 2 }, 2: { x: 0, z: 0 }, 3: { x: -Math.PI / 2, z: 0 },
                    4: { x: Math.PI / 2, z: 0 }, 5: { x: Math.PI, z: 0 }, 6: { x: 0, z: -Math.PI / 2 }
                };

                const targetRot1 = faceRotations[d1] || { x: 0, z: 0 };
                const targetRot2 = faceRotations[d2] || { x: 0, z: 0 };

                dice.forEach((die, i) => {
                    const isLeft = i === 0;
                    die.position.set(isLeft ? -4 : 4, 8, isLeft ? 3 : -3);
                    const targetRot = isLeft ? targetRot1 : targetRot2;
                    const fullSpins = (Math.PI * 2) * 3;

                    new window.TWEEN.Tween(die.position)
                        .to({ y: 2.3, x: isLeft ? -1.8 : 1.8, z: 0 }, 750)
                        .easing(window.TWEEN.Easing.Bounce.Out).start();

                    new window.TWEEN.Tween(die.rotation)
                        .to({ x: targetRot.x + fullSpins, y: fullSpins + (Math.random() * 0.5), z: targetRot.z + fullSpins }, 750)
                        .easing(window.TWEEN.Easing.Cubic.Out)
                        .onComplete(() => { if (i === 1) { setIsRolling(false); onComplete(); } }).start();
                });
            };

            // Animasi Bidak 3D Melompat Parabola
            const animatePawnMovement = (playerId, fromPos, steps, onComplete) => {
                const pawn = playerMeshesRef.current[playerId];
                if (!pawn) { onComplete(); return; }
                setIsMoving(true);
                let currentStep = 0;

                const stepNext = () => {
                    if (currentStep >= steps) { setIsMoving(false); onComplete(); return; }
                    currentStep++;
                    const nextTileId = (fromPos + currentStep) % 40;
                    const targetCoords = getTileCoordinates(nextTileId);
                    const startX = pawn.position.x;
                    const startZ = pawn.position.z;
                    playSoundEffect('hop');

                    const startTime = performance.now();
                    const duration = 280;
                    const hopAnim = (now) => {
                        const elapsed = now - startTime;
                        const progress = Math.min(elapsed / duration, 1);
                        pawn.position.x = startX + (targetCoords.x - startX) * progress;
                        pawn.position.z = startZ + (targetCoords.z - startZ) * progress;
                        pawn.position.y = 1.6 + Math.sin(progress * Math.PI) * 2.8;

                        if (progress < 1) requestAnimationFrame(hopAnim);
                        else { pawn.position.y = 1.6; setTimeout(stepNext, 50); }
                    };
                    requestAnimationFrame(hopAnim);
                };
                stepNext();
            };

            // Lempar Dadu & Gerak Otomatis
            const handleRollDice = () => {
                if (isRolling || isMoving || turnPhase !== 'ROLL') return;
                const d1 = Math.floor(Math.random() * 6) + 1;
                const d2 = Math.floor(Math.random() * 6) + 1;
                const total = d1 + d2;
                const isDouble = d1 === d2;

                setCurrentRoll([d1, d2]);
                roll3DDice(d1, d2, () => {
                    addLog(`${currentPlayer.name} melempar ${d1} & ${d2} (Total: ${total})${isDouble ? ' • Kembar!' : ''}`);
                    const startPos = currentPlayer.position;

                    animatePawnMovement(currentPlayer.id, startPos, total, () => {
                        const finalPos = (startPos + total) % 40;
                        updatePlayer(currentPlayer.id, { position: finalPos });

                        if (startPos + total >= 40) {
                            const bonus = finalPos === 0 ? 30000 : 20000;
                            adjustPlayerMoney(currentPlayer.id, bonus);
                            triggerMoneyAnimation(bonus, 'Bonus GO', { from: 'Bank', to: currentPlayer.name });
                            addLog(`${currentPlayer.name} ${finalPos === 0 ? 'berhenti di' : 'lewat'} GO, dapat Rp ${bonus.toLocaleString('id-ID')}.`);
                        }
                        handleTileAction(finalPos, isDouble);
                    });
                });

            const handleTileAction = (tileId, isDouble) => {
                const space = board[tileId];

                if (isOwnable(space)) {
                    if (space.owner === undefined) {
                        if (currentPlayer.isBot) {
                            if (currentPlayer.money >= space.price + 20000) {
                                buyProperty(space, currentPlayer.id);
                            }
                            finishTurnAction(isDouble);
                        } else {
                            setSelectedActionSpace(space);
                            setTurnPhase('ACTION');
                        }
                    } else if (space.owner !== currentPlayer.id) {
                        const owner = players[space.owner];
                        let rent = space.rent || 1000;
                        if (space.type === 'property') {
                            const multipliers = [1, 3, 7, 14, 24];
                            rent = space.hotel ? rent * 40 : rent * multipliers[space.houses || 0];
                            if (touristSeasonTurns > 0 && [1, 26, 29].includes(space.id)) rent *= 2;
                        }

                        adjustPlayerMoney(currentPlayer.id, -rent);
                        adjustPlayerMoney(owner.id, rent);
                        triggerMoneyAnimation(rent, 'Sewa', { from: currentPlayer.name, to: owner.name });
                        setTurnSummary({
                            title: `Bayar Sewa ${space.name}`,
                            detail: `${currentPlayer.name} membayar sewa kepada ${owner.name}.`,
                            amount: -rent,
                            tone: 'pay'
                        });
                        addLog(`${currentPlayer.name} membayar sewa Rp ${rent.toLocaleString('id-ID')} kepada ${owner.name}.`);
                        finishTurnAction(isDouble);
                    } else {
                        finishTurnAction(isDouble);
                    }
                } else if (['chance', 'chest'].includes(space.type)) {
                    const deck = space.type === 'chance' ? chanceCards : chestCards;
                    const card = deck[Math.floor(Math.random() * deck.length)];
                    setActiveCard(card);
                    setTurnPhase('CARD');
                    addLog(`Kartu: ${card.text}`);
                    if (currentPlayer.isBot) setTimeout(() => applyCard(card, isDouble), 2000);
                } else if (space.type === 'tax') {
                    adjustPlayerMoney(currentPlayer.id, -space.price);
                    setFreeParkingPot(prev => prev + space.price);
                    triggerMoneyAnimation(space.price, 'Pajak Daerah', { from: currentPlayer.name, to: 'Jackpot' });
                    setTurnSummary({ title: 'Bayar Pajak', detail: `${currentPlayer.name} membayar pajak ke Jackpot.`, amount: -space.price, tone: 'pay' });
                    finishTurnAction(isDouble);
                } else if (space.type === 'parking') {
                    if (freeParkingPot > 0) {
                        adjustPlayerMoney(currentPlayer.id, freeParkingPot);
                        triggerMoneyAnimation(freeParkingPot, 'Jackpot Parkir', { from: 'Jackpot', to: currentPlayer.name });
                        addLog(`${currentPlayer.name} mengklaim Jackpot Rp ${freeParkingPot.toLocaleString('id-ID')}!`);
                        setFreeParkingPot(0);
                    }
                    finishTurnAction(isDouble);
                } else if (space.type === 'gotojail') {
                    sendToJail(currentPlayer.id);
                    finishTurnAction(false);
                } else {
                    finishTurnAction(isDouble);
                }
            };

            const buyProperty = (space, buyerId) => {
                adjustPlayerMoney(buyerId, -space.price);
                triggerMoneyAnimation(space.price, 'Beli Kavling', { from: players[buyerId].name, to: 'Bank' });
                setBoard(prev => prev.map(s => s.id === space.id ? { ...s, owner: buyerId } : s));
                addLog(`${players[buyerId].name} membeli ${space.name} seharga Rp ${space.price.toLocaleString('id-ID')}.`);
            };

            const buildHouse = (spaceId) => {
                const space = board[spaceId];
                const cost = getBuildCost(space);
                if (currentPlayer.money < cost) return;

                adjustPlayerMoney(currentPlayer.id, -cost);
                setBoard(prev => prev.map(s => {
                    if (s.id !== spaceId) return s;
                    if ((s.houses || 0) < 4) return { ...s, houses: (s.houses || 0) + 1 };
                    return { ...s, houses: 0, hotel: true };
                }));
                triggerMoneyAnimation(cost, 'Bangun Properti', { from: currentPlayer.name, to: 'Bank' });
                addLog(`${currentPlayer.name} mendirikan bangunan di ${space.name}!`);
            };

            const applyCard = (card, isDouble) => {
                if (card.action === 'tourist_season') {
                    setTouristSeasonTurns(players.length * 2);
                    addLog(`🌴 EVENT AKTIF: Musim Liburan Turis! Sewa Kuta, Seminyak, Canggu melonjak 2x lipat!`);
                } else if (card.action === 'money') {
                    adjustPlayerMoney(currentPlayer.id, card.amount);
                    triggerMoneyAnimation(card.amount, 'Efek Kartu', { from: card.amount > 0 ? 'Bank' : currentPlayer.name, to: card.amount > 0 ? currentPlayer.name : 'Bank' });
                } else if (card.action === 'move') {
                    const pawn = playerMeshesRef.current[currentPlayer.id];
                    if (pawn) {
                        const coords = getTileCoordinates(card.target);
                        pawn.position.set(coords.x, 1.6, coords.z);
                    }
                    updatePlayer(currentPlayer.id, { position: card.target });
                } else if (card.action === 'jail') {
                    sendToJail(currentPlayer.id);
                    setActiveCard(null);
                    finishTurnAction(false);
                    return;
                }
                setActiveCard(null);
                finishTurnAction(isDouble);
            };

            const sendToJail = (playerId) => {
                updatePlayer(playerId, { position: 10, inJail: true, jailTurns: 0 });
                const pawn = playerMeshesRef.current[playerId];
                if (pawn) {
                    const coords = getTileCoordinates(10);
                    pawn.position.set(coords.x, 1.6, coords.z);
                }
                addLog(`${players[playerId].name} dijebloskan ke Penjara Kerobokan!`);
            };

            const finishTurnAction = (isDouble) => {
                setSelectedActionSpace(null);
                if (isDouble) {
                    setTurnPhase('ROLL');
                    setTurnSummary({ title: "Dadu Kembar!", detail: `${currentPlayer.name} berhak melempar dadu lagi.`, amount: null, tone: "gain" });
                } else {
                    setTurnPhase('END');
                    setTurnSummary({ title: "Selesai Aksi", detail: "Giliran akan otomatis berpindah dalam 5 detik.", amount: null, tone: "neutral" });
                }
            };

            const endTurn = () => {
                const active = players.filter(p => !p.bankrupt);
                if (active.length <= 1) {
                    setWinner(active[0] || currentPlayer);
                    setTurnPhase('WIN');
                    return;
                }

                setTouristSeasonTurns(prev => Math.max(0, prev - 1));
                setTotalTurnsCount(prev => prev + 1);

                let nextIndex = (turnIndex + 1) % players.length;
                while (players[nextIndex].bankrupt) {
                    nextIndex = (nextIndex + 1) % players.length;
                }

                setTurnIndex(nextIndex);
                setTurnPhase('ROLL');
                setTurnSummary({ title: `Giliran ${players[nextIndex].name}`, detail: "Kocok dadu 3D untuk melangkah.", amount: null, tone: "neutral" });
                addLog(`Giliran berganti ke ${players[nextIndex].name}.`);
            };

            // Auto-End Turn 5s
            React.useEffect(() => {
                if (turnPhase !== 'END') { setAutoEndCountdown(5); return; }
                setAutoEndCountdown(5);
                const timer = setInterval(() => setAutoEndCountdown(prev => Math.max(0, prev - 1)), 1000);
                const timeout = setTimeout(() => endTurn(), 5000);
                return () => { clearInterval(timer); clearTimeout(timeout); };
            }, [turnPhase, turnIndex]);

            // Bot Otomatis
            React.useEffect(() => {
                if (screen !== 'GAME' || !currentPlayer.isBot || isRolling || isMoving) return;
                if (turnPhase === 'ROLL') {
                    const delay = setTimeout(() => handleRollDice(), 1200);
                    return () => clearTimeout(delay);
                } else if (turnPhase === 'END') {
                    const delay = setTimeout(() => endTurn(), 1000);
                    return () => clearTimeout(delay);
                }
            }, [turnPhase, turnIndex, screen, isRolling, isMoving]);

            const updatePlayer = (id, changes) => {
                setPlayers(prev => prev.map(p => p.id === id ? { ...p, ...changes } : p));
            };

            const adjustPlayerMoney = (id, amount) => {
                setPlayers(prev => prev.map(p => {
                    if (p.id !== id) return p;
                    const newMoney = p.money + amount;
                    if (newMoney < 0) return { ...p, money: 0, bankrupt: true };
                    return { ...p, money: newMoney };
                }));
            };

            const startGame = () => {
                const initPlayers = (lobbyPlayers.length >= 2 ? lobbyPlayers : players).map((p, idx) => ({
                    id: idx,
                    setupId: p.setupId,
                    name: p.name || `Pemain ${idx + 1}`,
                    token: p.token,
                    color: p.color,
                    money: startingMoney,
                    position: 0,
                    isBot: p.isBot || false,
                    inJail: false,
                    bankrupt: false
                }));
                setPlayers(initPlayers);
                setTurnIndex(0);
                setTurnPhase('ROLL');
                setTotalTurnsCount(1);
                setTouristSeasonTurns(0);
                setScreen('GAME');
            };

            const setCameraView = (type) => {
                const cam = threeSceneRef.current?.camera;
                const ctrl = threeSceneRef.current?.controls;
                if (!cam || !ctrl) return;
                if (type === 'orbit') {
                    new window.TWEEN.Tween(cam.position).to({ x: 0, y: 34, z: 32 }, 600).start();
                    ctrl.target.set(0, 0, 0);
                } else if (type === 'top') {
                    new window.TWEEN.Tween(cam.position).to({ x: 0, y: 48, z: 0.1 }, 600).start();
                    ctrl.target.set(0, 0, 0);
                } else if (type === 'pawn') {
                    const pawn = playerMeshesRef.current[currentPlayer.id];
                    if (pawn) {
                        new window.TWEEN.Tween(cam.position).to({ x: pawn.position.x + 8, y: pawn.position.y + 12, z: pawn.position.z + 12 }, 600).start();
                        ctrl.target.copy(pawn.position);
                    }
                }
            };

            const calcNetWorth = (p) => {
                const assets = board.filter(s => s.owner === p.id);
                return p.money + assets.reduce((sum, s) => sum + (s.price || 0) + ((s.houses || 0) * 10000), 0);
            };

            const selectedInfoSpace = selectedInfoSpaceId !== null ? board[selectedInfoSpaceId] : null;
            const rentInfo = selectedInfoSpace ? getRentBreakdown(selectedInfoSpace) : null;

            // --- 7. TAMPILAN SCREEN LOGIN ---
            if (screen === 'LOGIN') {
                const lastSession = getLastOnlineSession();
                return (
                    <div className="w-full h-full flex items-center justify-center p-4 bg-gradient-to-br from-slate-950 via-slate-900 to-emerald-950">
                        <form onSubmit={handleLogin} className="max-w-md w-full glass-panel rounded-2xl overflow-hidden border border-emerald-500/40 shadow-2xl">
                            <div className="bg-emerald-900/90 text-white p-6 border-b border-emerald-600/40 text-center">
                                <span className="text-xs font-black uppercase tracking-widest text-emerald-300">WebGL 3D Edition</span>
                                <h1 className="text-3xl font-black mt-1">Monopoli Bali 3D</h1>
                                <p className="text-xs text-emerald-200/80 mt-1">Papan 3D, Dadu Fisik, & Multiplayer Online</p>
                            </div>
                            <div className="p-6 space-y-4">
                                {lastSession?.roomCode && (
                                    <button
                                        type="button"
                                        onClick={() => {
                                            setJoinCode(lastSession.roomCode);
                                            setLoginForm(prev => ({ ...prev, username: lastSession.playerName || "Player" }));
                                        }}
                                        className="w-full bg-amber-500/20 hover:bg-amber-500/30 text-amber-300 border border-amber-500/40 rounded-xl py-2.5 font-bold text-xs transition-all"
                                    >
                                        Lanjutkan Room: {lastSession.roomCode}
                                    </button>
                                )}
                                <label className="block">
                                    <span className="text-xs font-black uppercase text-slate-300">Nama Anda</span>
                                    <input
                                        value={loginForm.username}
                                        onChange={(e) => setLoginForm(prev => ({ ...prev, username: e.target.value }))}
                                        className="mt-1 w-full rounded-xl bg-slate-800/90 border border-slate-700 px-4 py-3 font-bold text-white outline-none focus:border-emerald-500"
                                        placeholder="Masukkan nama pemain"
                                        required
                                    />
                                </label>
                                {setupError && <p className="text-xs font-bold text-red-400 bg-red-950/60 p-2.5 rounded-lg border border-red-800">{setupError}</p>}
                                <div className="grid grid-cols-2 gap-3 pt-2">
                                    <button type="submit" className="w-full bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-xl py-3 font-black shadow transition-all border border-slate-600">
                                        Main Lokal
                                    </button>
                                    <button type="button" onClick={createOnlineRoom} className="w-full bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl py-3 font-black shadow transition-all">
                                        Buat Room Online
                                    </button>
                                </div>
                                <div className="flex gap-2 pt-1 border-t border-slate-700/80">
                                    <input
                                        value={joinCode}
                                        onChange={(e) => setJoinCode(e.target.value)}
                                        placeholder="KODE ROOM"
                                        maxLength="6"
                                        className="w-1/3 rounded-xl bg-slate-800/90 border border-slate-700 px-3 py-2 font-black text-center text-amber-400 uppercase tracking-widest outline-none focus:border-amber-400 text-sm"
                                    />
                                    <button type="button" onClick={joinOnlineRoom} className="flex-1 bg-blue-600 hover:bg-blue-500 text-white rounded-xl py-2 font-black shadow transition-all text-xs uppercase tracking-wider">
                                        Gabung Online
                                    </button>
                                </div>
                            </div>
                        </form>
                    </div>
                );
            }

            // --- 8. TAMPILAN SCREEN LOBBY ---
            if (screen === 'LOBBY') {
                return (
                    <div className="w-full h-full flex items-center justify-center p-4 bg-gradient-to-br from-slate-950 via-slate-900 to-emerald-950 text-white">
                        <div className="max-w-2xl w-full glass-panel rounded-2xl p-6 shadow-2xl border border-emerald-500/40">
                            <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 border-b border-slate-700 pb-4 mb-5">
                                <div>
                                    <span className="px-2.5 py-0.5 bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 rounded-full text-[0.65rem] font-black uppercase tracking-wider">
                                        {isOnline ? `Online Room • Kode: ${roomCode}` : 'Mode Lokal (Hotseat)'}
                                    </span>
                                    <h1 className="text-2xl font-black mt-1 text-white">{roomName}</h1>
                                </div>
                                {isOnline && (
                                    <div className="bg-amber-400/20 text-amber-300 border border-amber-400/30 px-3 py-1.5 rounded-xl font-mono text-sm font-black tracking-widest">
                                        {roomCode}
                                    </div>
                                )}
                            </div>

                            {/* Opsi Modal Awal */}
                            <div className="bg-slate-800/80 border border-slate-700 rounded-xl p-3.5 mb-5">
                                <span className="text-xs font-black uppercase text-amber-400 block mb-2">Pilihan Modal Awal:</span>
                                <div className="grid grid-cols-3 gap-2.5">
                                    {[
                                        { label: "⚡ Cepat", val: 100000, desc: "Rp 100.000" },
                                        { label: "⭐ Standar", val: 150000, desc: "Rp 150.000" },
                                        { label: "👑 Sultan", val: 250000, desc: "Rp 250.000" }
                                    ].map(item => (
                                        <button
                                            key={item.val}
                                            onClick={() => setStartingMoney(item.val)}
                                            className={`p-2 rounded-lg font-black text-xs transition-all border text-center ${startingMoney === item.val ? 'bg-emerald-600 text-white border-emerald-400 shadow-lg scale-102' : 'bg-slate-900/80 text-slate-300 border-slate-700 hover:bg-slate-700'}`}
                                        >
                                            {item.label}<br/><span className="text-[0.65rem] font-normal opacity-80">{item.desc}</span>
                                        </button>
                                    ))}
                                </div>
                            </div>

                            {/* Daftar Pemain */}
                            <div className="space-y-3 mb-6">
                                <div className="flex justify-between items-center text-xs font-bold text-slate-300">
                                    <span>DAFTAR PEMAIN ({lobbyPlayers.length}/6):</span>
                                    {(!isOnline || isHost) && lobbyPlayers.length < 6 && (
                                        <div className="flex gap-2">
                                            <button 
                                                onClick={() => {
                                                    const id = lobbyPlayers.length;
                                                    const nextToken = tokenChoices[id % tokenChoices.length];
                                                    const nextColor = playerColors[id % playerColors.length];
                                                    setLobbyPlayers(prev => [...prev, { setupId: `bot-${Date.now()}`, name: `Bot ${id}`, token: nextToken, color: nextColor, isBot: true }]);
                                                }}
                                                className="text-emerald-400 hover:text-emerald-300 font-bold text-xs"
                                            >
                                                + Tambah Bot
                                            </button>
                                        </div>
                                    )}
                                </div>
                                {lobbyPlayers.map((p, idx) => (
                                    <div key={p.setupId || idx} className="flex items-center gap-3 bg-slate-800/60 border border-slate-700 p-2.5 rounded-xl">
                                        <span className="w-8 h-8 rounded-lg flex items-center justify-center text-lg font-bold text-white shadow" style={{ backgroundColor: p.color }}>
                                            {p.token}
                                        </span>
                                        <span className="font-bold text-sm flex-1">{p.name}</span>
                                        <span className="text-xs px-2 py-0.5 rounded bg-slate-700 text-slate-300 font-semibold">
                                            {p.isBot ? "Bot AI" : "Pemain Asli"}
                                        </span>
                                    </div>
                                ))}
                            </div>

                            {(!isOnline || isHost) ? (
                                <button
                                    onClick={startGame}
                                    className="w-full bg-gradient-to-r from-emerald-600 to-teal-500 hover:from-emerald-500 text-white font-black py-4 rounded-xl shadow-xl transition-all transform hover:scale-[1.01] active:scale-95 text-base uppercase tracking-wider"
                                >
                                    🚀 Mulai Game 3D
                                </button>
                            ) : (
                                <div className="text-center p-3 font-bold text-slate-400 bg-slate-800/50 rounded-xl">
                                    Menunggu Host Memulai Game...
                                </div>
                            )}
                        </div>
                    </div>
                );
            }

            // --- 9. TAMPILAN SCREEN GAME 3D DENGAN HUD & RAYCASTER ---
            return (
                <div className="w-full h-full relative overflow-hidden bg-slate-950">
                    {/* Kanvas 3D Three.js */}
                    <div id="canvas3d-container" className="w-full h-full absolute inset-0 cursor-grab active:cursor-grabbing"></div>

                    {/* Animasi Uang Terbang */}
                    {moneyEffects.map((e) => (
                        <div key={e.id} className="cash-flyer">
                            <div className="rupiah-bill">
                                {e.amount > 0 ? '+' : ''} Rp {Math.abs(e.amount).toLocaleString('id-ID')}
                            </div>
                            <div className="transfer-route">{e.label}</div>
                        </div>
                    ))}

                    {/* HUD OVERLAY 2D */}
                    <div id="ui-overlay">
                        {/* Top Bar: Giliran & Kontrol */}
                        <div className="p-4 flex items-start justify-between">
                            <div className="interactive glass-panel rounded-2xl p-3 border-l-4 text-white flex items-center gap-3" style={{ borderLeftColor: currentPlayer.color }}>
                                <div className="text-2xl p-1.5 rounded-xl bg-slate-800/80 shadow">
                                    {currentPlayer.token}
                                </div>
                                <div>
                                    <div className="text-[0.7rem] font-bold text-slate-300 uppercase tracking-wider">
                                        Giliran #{totalTurnsCount}: <span className="text-amber-300">{currentPlayer.name}</span>
                                    </div>
                                    <div className="text-base font-black text-emerald-400">
                                        Rp {currentPlayer.money.toLocaleString('id-ID')}
                                    </div>
                                </div>
                            </div>

                            {/* Tombol Kamera & Kontrol Audio */}
                            <div className="interactive flex flex-col items-end gap-2">
                                <div className="glass-panel px-3 py-1 rounded-full flex items-center gap-2 text-xs font-bold text-white shadow-xl">
                                    <button onClick={() => setIsSfxMuted(!isSfxMuted)} className={`px-2 py-0.5 rounded-full text-xs font-black ${isSfxMuted ? 'text-red-400' : 'text-emerald-400'}`}>
                                        {isSfxMuted ? "🔇 SFX" : "🎲 SFX"}
                                    </button>
                                    <div className="h-3 w-px bg-white/20"></div>
                                    <span className="text-[0.7rem] text-slate-300">🎵</span>
                                    <input type="range" min="0" max="1" step="0.05" value={musicVolume} onChange={(e) => setMusicVolume(parseFloat(e.target.value))} className="w-14 h-1 accent-emerald-400 cursor-pointer" />
                                </div>

                                <div className="glass-panel p-1 rounded-xl flex gap-1 text-[0.7rem] font-bold text-white">
                                    <button onClick={() => setCameraView('orbit')} className="px-2 py-1 rounded-lg bg-slate-800/90 hover:bg-slate-700">🎥 3D</button>
                                    <button onClick={() => setCameraView('top')} className="px-2 py-1 rounded-lg bg-slate-800/90 hover:bg-slate-700">🗺️ Top</button>
                                    <button onClick={() => setCameraView('pawn')} className="px-2 py-1 rounded-lg bg-slate-800/90 hover:bg-slate-700">🎯 Bidak</button>
                                </div>
                            </div>
                        </div>

                        {/* Banner Event Musiman */}
                        {touristSeasonTurns > 0 && (
                            <div className="self-center glass-panel px-4 py-1.5 rounded-full border border-amber-400/50 shadow-2xl flex items-center gap-2 text-white animate-bounce">
                                <span className="text-base">🌴</span>
                                <span className="text-xs font-black text-amber-300 tracking-wide">
                                    MUSIM LIBURAN TURIS AKTIF! Sewa Kuta, Seminyak, Canggu 2x Lipat (Sisa {touristSeasonTurns} giliran)
                                </span>
                            </div>
                        )}

                        {/* Modal Beli Properti */}
                        {turnPhase === 'ACTION' && selectedActionSpace && canTakeAction && (
                            <div className="self-center interactive animate-pop-in glass-panel rounded-2xl p-5 border-2 max-w-sm w-full mx-4 text-white text-center shadow-2xl" style={{ borderColor: selectedActionSpace.color || '#10b981' }}>
                                <div className="text-xs font-black uppercase tracking-wider text-slate-300 mb-1">Peluang Investasi</div>
                                <h3 className="text-2xl font-black mb-2" style={{ color: selectedActionSpace.color || '#fff' }}>{selectedActionSpace.name}</h3>
                                <p className="text-xs text-slate-300 italic mb-4">"{selectedActionSpace.desc}"</p>
                                <div className="bg-slate-800/80 rounded-xl p-3 mb-4 flex justify-between text-xs font-bold">
                                    <span className="text-slate-400">Harga Beli:</span>
                                    <span className="text-emerald-400 text-sm font-black">Rp {selectedActionSpace.price.toLocaleString('id-ID')}</span>
                                </div>
                                <div className="grid grid-cols-2 gap-3">
                                    <button onClick={() => finishTurnAction(false)} className="py-2.5 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl font-black text-xs shadow">Lewati</button>
                                    <button onClick={() => { buyProperty(selectedActionSpace, currentPlayer.id); finishTurnAction(false); }} disabled={currentPlayer.money < selectedActionSpace.price} className="py-2.5 bg-gradient-to-r from-emerald-600 to-teal-500 text-white rounded-xl font-black text-xs shadow disabled:opacity-50">Beli Kavling</button>
                                </div>
                            </div>
                        )}

                        {/* Modal Kartu */}
                        {turnPhase === 'CARD' && activeCard && (
                            <div className="self-center interactive animate-pop-in glass-panel rounded-2xl p-5 border-2 border-amber-400 max-w-sm w-full mx-4 text-white text-center shadow-2xl">
                                <div className="text-4xl mb-2">🎁</div>
                                <h3 className="text-xl font-black text-amber-300 uppercase mb-2">Kartu Peristiwa</h3>
                                <p className="text-sm font-semibold text-slate-200 mb-4 bg-slate-800/60 p-3 rounded-xl border border-slate-700">{activeCard.text}</p>
                                {canTakeAction && (
                                    <button onClick={() => applyCard(activeCard, false)} className="w-full py-3 bg-gradient-to-r from-blue-600 to-indigo-600 text-white rounded-xl font-black text-xs shadow uppercase tracking-wider">Lanjutkan</button>
                                )}
                            </div>
                        )}

                        {/* POP-UP DETAIL INFORMASI WILAYAH (PROPERTY DEED CARD - RAYCASTER KLIK PETAK 3D) */}
                        {selectedInfoSpace && (
                            <div className="absolute inset-0 bg-slate-950/70 backdrop-blur-sm z-50 flex items-center justify-center p-4 interactive">
                                <div className="glass-panel max-w-md w-full rounded-2xl border-2 border-slate-700 overflow-hidden shadow-2xl animate-pop-in">
                                    <div className="p-4 text-white flex justify-between items-start" style={{ backgroundColor: selectedInfoSpace.color || '#064e3b' }}>
                                        <div>
                                            <span className="text-[0.65rem] font-black uppercase tracking-wider opacity-80">Sertifikat Properti</span>
                                            <h3 className="text-2xl font-black uppercase leading-tight drop-shadow">{selectedInfoSpace.name}</h3>
                                        </div>
                                        <button onClick={() => setSelectedInfoSpaceId(null)} className="w-8 h-8 rounded-full bg-black/30 hover:bg-black/50 text-white font-black flex items-center justify-center">✕</button>
                                    </div>

                                    <div className="p-4 space-y-3.5 max-h-[70vh] overflow-y-auto text-xs">
                                        <p className="text-slate-300 italic bg-slate-800/40 p-2.5 rounded-lg border border-slate-700/60">"{selectedInfoSpace.desc || 'Destinasi wisata Bali.'}"</p>

                                        {/* Status Kepemilikan */}
                                        <div className="grid grid-cols-2 gap-2 text-center">
                                            <div className="bg-slate-800/60 p-2 rounded-lg border border-slate-700">
                                                <span className="text-[0.65rem] text-slate-400 block">Pemilik:</span>
                                                <span className="font-black text-amber-300 text-sm">
                                                    {selectedInfoSpace.owner !== undefined ? players[selectedInfoSpace.owner]?.name : 'Belum Dimiliki'}
                                                </span>
                                            </div>
                                            <div className="bg-slate-800/60 p-2 rounded-lg border border-slate-700">
                                                <span className="text-[0.65rem] text-slate-400 block">Harga Dasar:</span>
                                                <span className="font-black text-emerald-400 text-sm">
                                                    {selectedInfoSpace.price ? `Rp ${selectedInfoSpace.price.toLocaleString('id-ID')}` : '-'}
                                                </span>
                                            </div>
                                        </div>

                                        {/* Rincian Sewa Bertingkat */}
                                        {rentInfo && (
                                            <div className="border border-slate-700/80 rounded-xl overflow-hidden bg-slate-900/60">
                                                <div className="bg-slate-800/90 px-3 py-1.5 font-black text-slate-300 text-[0.68rem] uppercase flex justify-between">
                                                    <span>Tingkat Bangunan</span>
                                                    <span>Tarif Sewa</span>
                                                </div>
                                                <div className="divide-y divide-slate-800 p-1 text-slate-300">
                                                    <div className="flex justify-between p-1.5"><span>Tanah Kosong:</span><span className="font-bold text-white">Rp {rentInfo.base.toLocaleString('id-ID')}</span></div>
                                                    <div className="flex justify-between p-1.5"><span>1 Rumah Hijau:</span><span className="font-bold text-white">Rp {rentInfo.house1.toLocaleString('id-ID')}</span></div>
                                                    <div className="flex justify-between p-1.5"><span>2 Rumah:</span><span className="font-bold text-white">Rp {rentInfo.house2.toLocaleString('id-ID')}</span></div>
                                                    <div className="flex justify-between p-1.5"><span>3 Rumah:</span><span className="font-bold text-white">Rp {rentInfo.house3.toLocaleString('id-ID')}</span></div>
                                                    <div className="flex justify-between p-1.5"><span>4 Rumah:</span><span className="font-bold text-white">Rp {rentInfo.house4.toLocaleString('id-ID')}</span></div>
                                                    <div className="flex justify-between p-1.5 text-amber-400 font-black"><span>Hotel Mewah:</span><span>Rp {rentInfo.hotel.toLocaleString('id-ID')}</span></div>
                                                </div>
                                            </div>
                                        )}

                                        {/* Aksi Kepemilikan (Bangun / Tawar) */}
                                        {selectedInfoSpace.owner === currentPlayer.id && (
                                            <div className="pt-2">
                                                <button
                                                    onClick={() => buildHouse(selectedInfoSpace.id)}
                                                    disabled={currentPlayer.money < (rentInfo?.buildCost || 10000) || selectedInfoSpace.hotel}
                                                    className="w-full py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl font-black text-xs shadow disabled:opacity-40"
                                                >
                                                    {selectedInfoSpace.hotel ? "Bangunan Maksimal (Hotel)" : `Bangun Rumah (Rp ${(rentInfo?.buildCost || 10000).toLocaleString('id-ID')})`}
                                                </button>
                                            </div>
                                        )}

                                        {/* Tawar Properti Lawan (Trade) */}
                                        {isOwnable(selectedInfoSpace) && selectedInfoSpace.owner !== undefined && selectedInfoSpace.owner !== currentPlayer.id && (
                                            <div className="pt-2">
                                                <button
                                                    onClick={() => {
                                                        const offer = prompt(`Ajukan penawaran harga untuk membeli ${selectedInfoSpace.name} dari ${players[selectedInfoSpace.owner].name}:`, selectedInfoSpace.price + 5000);
                                                        if (offer && parseInt(offer) > 0) {
                                                            const val = parseInt(offer);
                                                            if (currentPlayer.money >= val) {
                                                                adjustPlayerMoney(currentPlayer.id, -val);
                                                                adjustPlayerMoney(selectedInfoSpace.owner, val);
                                                                setBoard(prev => prev.map(s => s.id === selectedInfoSpace.id ? { ...s, owner: currentPlayer.id } : s));
                                                                triggerMoneyAnimation(val, 'Barter Kavling', { from: currentPlayer.name, to: players[selectedInfoSpace.owner].name });
                                                                addLog(`${currentPlayer.name} berhasil membeli ${selectedInfoSpace.name} dari ${players[selectedInfoSpace.owner].name} seharga Rp ${val.toLocaleString('id-ID')}.`);
                                                                setSelectedInfoSpaceId(null);
                                                            } else {
                                                                alert("Saldo Anda tidak mencukupi untuk penawaran ini.");
                                                            }
                                                        }
                                                    }}
                                                    className="w-full py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl font-black text-xs shadow"
                                                >
                                                    Tawar Aset Ini (Barter/Trade)
                                                </button>
                                            </div>
                                        )}
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* Bottom Bar: Kontrol Giliran & Turn Summary */}
                        <div className="p-4 flex items-end justify-between">
                            {/* Panel Ringkasan Aksi Giliran (Turn Summary) */}
                            <div className="interactive glass-panel rounded-2xl p-3.5 w-80 shadow-2xl border border-slate-700">
                                <div className="text-[0.65rem] font-black uppercase text-amber-400 tracking-wider mb-1">Status Giliran</div>
                                <div className="text-sm font-black text-white">{turnSummary.title}</div>
                                <div className="text-xs text-slate-300 mt-0.5 leading-snug">{turnSummary.detail}</div>
                                <div className="mt-2 pt-2 border-t border-slate-700/60 flex justify-between text-[0.68rem] text-slate-400">
                                    <span>Tips: Klik petak 3D untuk cek sertifikat.</span>
                                </div>
                            </div>

                            {/* Tombol Utama Giliran */}
                            <div className="interactive flex flex-col items-center gap-2">
                                {turnPhase === 'ROLL' && canTakeAction && (
                                    <button
                                        onClick={handleRollDice}
                                        disabled={isRolling || isMoving}
                                        className="bg-gradient-to-r from-amber-500 via-yellow-400 to-amber-600 text-slate-950 px-8 py-3.5 rounded-full font-black text-base shadow-2xl transition-all transform hover:scale-105 active:scale-95 disabled:opacity-50 border-2 border-white flex items-center gap-2 animate-bounce"
                                    >
                                        <span>🎲</span>
                                        <span>LEMPAR DADU 3D</span>
                                    </button>
                                )}

                                {turnPhase === 'END' && canTakeAction && (
                                    <button
                                        onClick={endTurn}
                                        className="bg-gradient-to-r from-red-600 to-rose-600 text-white px-8 py-3.5 rounded-full font-black text-sm shadow-2xl transition-all transform hover:scale-105 active:scale-95 border-2 border-white flex items-center gap-2"
                                    >
                                        <span>🛑 Akhiri Giliran</span>
                                        <span className="bg-red-950/70 px-2 py-0.5 rounded-full font-mono text-xs text-red-200">{autoEndCountdown}s</span>
                                    </button>
                                )}

                                {currentPlayer.isBot && (
                                    <div className="glass-panel px-4 py-2 rounded-full text-xs font-bold text-emerald-300 flex items-center gap-2">
                                        <span className="animate-spin">⚙️</span>
                                        <span>{currentPlayer.name} sedang berpikir &amp; melangkah...</span>
                                    </div>
                                )}
                            </div>

                            {/* Jackpot Parkir */}
                            <div className="interactive glass-panel rounded-2xl p-3 text-right text-white">
                                <span className="text-[0.65rem] font-black uppercase text-amber-400 block">Pot Jackpot</span>
                                <span className="text-base font-black text-emerald-400">Rp {freeParkingPot.toLocaleString('id-ID')}</span>
                            </div>
                        </div>

                        {/* Modal Game Over / Leaderboard */}
                        {turnPhase === 'WIN' && winner && (
                            <div className="absolute inset-0 bg-slate-950/80 backdrop-blur-md z-50 flex items-center justify-center p-4 interactive">
                                <div className="glass-panel max-w-lg w-full rounded-2xl border-2 border-amber-400 p-6 text-white text-center shadow-2xl animate-pop-in">
                                    <div className="text-5xl mb-2 animate-bounce">🏆</div>
                                    <div className="text-xs font-black uppercase text-amber-400 tracking-widest">Pertandingan Berakhir</div>
                                    <h2 className="text-3xl font-black mb-4 text-amber-300">{winner.token} {winner.name} Sang Juara!</h2>

                                    <div className="grid grid-cols-3 gap-2 mb-4 text-center">
                                        <div className="bg-slate-800/80 p-2.5 rounded-xl border border-slate-700">
                                            <span className="text-[0.65rem] text-slate-400 block">Total Putaran</span>
                                            <span className="text-lg font-black text-amber-400">{totalTurnsCount}</span>
                                        </div>
                                        <div className="bg-slate-800/80 p-2.5 rounded-xl border border-slate-700">
                                            <span className="text-[0.65rem] text-slate-400 block">Raja Properti</span>
                                            <span className="text-xs font-black text-emerald-400 truncate block">
                                                {[...players].sort((a,b) => board.filter(s=>s.owner===b.id).length - board.filter(s=>s.owner===a.id).length)[0]?.name}
                                            </span>
                                        </div>
                                        <div className="bg-slate-800/80 p-2.5 rounded-xl border border-slate-700">
                                            <span className="text-[0.65rem] text-slate-400 block">Pemain Terkaya</span>
                                            <span className="text-xs font-black text-blue-400 truncate block">
                                                {[...players].sort((a,b) => calcNetWorth(b) - calcNetWorth(a))[0]?.name}
                                            </span>
                                        </div>
                                    </div>

                                    <div className="bg-slate-800/50 rounded-xl overflow-hidden border border-slate-700 text-left mb-5">
                                        <div className="bg-slate-800 px-3 py-1.5 text-[0.7rem] font-black uppercase text-slate-400 flex justify-between">
                                            <span>Peringkat</span>
                                            <span>Total Nilai Aset</span>
                                        </div>
                                        <div className="divide-y divide-slate-700/50">
                                            {[...players].sort((a, b) => calcNetWorth(b) - calcNetWorth(a)).map((p, idx) => (
                                                <div key={p.id} className="p-2.5 flex items-center justify-between text-xs">
                                                    <div className="flex items-center gap-2">
                                                        <span className="w-5 h-5 rounded-full bg-slate-700 flex items-center justify-center font-bold text-[0.65rem]">#{idx + 1}</span>
                                                        <span className="text-base">{p.token}</span>
                                                        <div>
                                                            <span className="font-bold block leading-tight">{p.name}</span>
                                                            <span className="text-[0.65rem] text-slate-400">{p.bankrupt ? '💀 Bangkrut' : `${board.filter(s=>s.owner===p.id).length} Kavling`}</span>
                                                        </div>
                                                    </div>
                                                    <div className="text-right">
                                                        <span className="font-black text-emerald-400 block">Rp {calcNetWorth(p).toLocaleString('id-ID')}</span>
                                                        <span className="text-[0.65rem] text-slate-400">Kas: Rp {p.money.toLocaleString('id-ID')}</span>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    </div>

                                    <div className="grid grid-cols-2 gap-3">
                                        <button onClick={() => setScreen('LOBBY')} className="py-3 bg-slate-800 hover:bg-slate-700 rounded-xl font-black text-xs uppercase shadow">Lobby Utama</button>
                                        <button onClick={startGame} className="py-3 bg-gradient-to-r from-emerald-600 to-teal-500 rounded-xl font-black text-xs uppercase shadow">Main Lagi</button>
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
