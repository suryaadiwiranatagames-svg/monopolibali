        // Fisher-Yates Shuffler
        const shuffleDeck = (size) => {
            const deck = Array.from({ length: size }, (_, i) => i);
            for (let i = deck.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [deck[i], deck[j]] = [deck[j], deck[i]];
            }
            return deck;
        };

        // Helpers Properti
        const getTileCoordinates = (index) => {
            const halfSize = 13.5;
            const step = 2.7;
            if (index <= 10) return { x: halfSize - (index * step), z: halfSize, rotY: 0 };
            if (index <= 20) return { x: -halfSize, z: halfSize - ((index - 10) * step), rotY: Math.PI / 2 };
            if (index <= 30) return { x: -halfSize + ((index - 20) * step), z: -halfSize, rotY: Math.PI };
            return { x: halfSize, z: -halfSize + ((index - 30) * step), rotY: -Math.PI / 2 };
        };

        const isOwnable = (space) => ['property', 'port', 'utility'].includes(space?.type);
        const getBuildCost = (space) => {
            if (!space || space.type !== 'property') return 0;
            return Math.max(5000, Math.round(space.price * 0.6));
        };

        const hasCompleteColorGroup = (space, boardState) => {
            if (!space || space.type !== 'property' || !space.color || space.owner === undefined) return false;
            const groupIds = colorGroups[space.color] || [];
            return groupIds.length > 0 && groupIds.every(id => {
                const s = boardState.find(b => b.id === id);
                return s && s.owner === space.owner;
            });
        };

        const calculateGoPropertyTax = (playerId, boardState) => {
            const playerAssets = boardState.filter(b => b.owner === playerId && b.type === 'property');
            return playerAssets.reduce((total, space) => {
                const zoneIndex = Math.min(3, Math.max(0, Math.floor((space.id || 0) / 10)));
                const houseRate = GO_HOUSE_TAX_BY_ZONE[zoneIndex];
                const hotelRate = GO_HOTEL_TAX_BY_ZONE[zoneIndex];
                if (space.hotel) return total + hotelRate;
                return total + ((space.houses || 0) * houseRate);
            }, 0);
        };

        const getRentBreakdown = (space, boardState) => {
            if (!space || space.type !== 'property') return null;
            const base = space.rent || 200;
            const completeGroup = hasCompleteColorGroup(space, boardState);
            return {
                base: completeGroup ? Math.ceil(base * COMPLETE_COLOR_RENT_MULTIPLIER) : base,
                rawBase: base,
                house1: base * 3,
                house2: base * 7,
                house3: base * 14,
                house4: base * 24,
                hotel: base * 40,
                mortgageValue: Math.round(space.price * 0.5),
                unmortgageCost: Math.round(space.price * 0.55),
                buildCost: getBuildCost(space),
                isMonopoly: completeGroup
            };
        };

        // Tekstur Petak Canvas Resolusi Tinggi (512x720) & Kontras Tajam
        const createTileTexture = (space) => {
            const canvas = document.createElement('canvas');
            canvas.width = 512; canvas.height = 720;
            const ctx = canvas.getContext('2d');

            // Latar belakang kartu gading lembut (anti-silau)
            ctx.fillStyle = "#fcfbfa";
            ctx.fillRect(0, 0, 512, 720);

            // Bingkai ganda kartu
            ctx.strokeStyle = "#94a3b8";
            ctx.lineWidth = 12;
            ctx.strokeRect(6, 6, 500, 708);

            ctx.strokeStyle = "rgba(15, 23, 42, 0.12)";
            ctx.lineWidth = 4;
            ctx.strokeRect(20, 20, 472, 680);

            // Baris Warna Properti
            if (space.type === 'property' && space.color) {
                ctx.fillStyle = space.color;
                ctx.fillRect(12, 12, 488, 175);
                ctx.strokeStyle = "rgba(0,0,0,0.35)";
                ctx.lineWidth = 6;
                ctx.strokeRect(12, 12, 488, 175);

                // Trim aksen emas di bawah color bar
                ctx.fillStyle = "#d97706";
                ctx.fillRect(12, 182, 488, 10);
            } else {
                ctx.fillStyle = "#e2e8f0";
                ctx.fillRect(12, 12, 488, 130);
                ctx.strokeStyle = "rgba(0,0,0,0.2)";
                ctx.lineWidth = 6;
                ctx.strokeRect(12, 12, 488, 130);
            }

            // Nama Petak (Font Tebal Hitam Solid, Jelas & Mudah Dibaca)
            ctx.fillStyle = "#090d16";
            ctx.font = "900 42px -apple-system, BlinkMacSystemFont, sans-serif";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";

            const words = space.name.split(" ");
            if (words.length > 2) {
                ctx.fillText(words.slice(0, 2).join(" "), 256, 260);
                ctx.fillText(words.slice(2).join(" "), 256, 315);
            } else if (words.length === 2) {
                ctx.fillText(words[0], 256, 260);
                ctx.fillText(words[1], 256, 315);
            } else {
                ctx.fillText(space.name, 256, 280);
            }

            // Ikon Petak Besar & Tajam
            ctx.font = "84px sans-serif";
            const icons = { go: "🏁", port: "🚢", utility: "⚡", chance: "❓", chest: "🎁", jail: "🔒", gotojail: "🚔", parking: "🅿️", tax: "💰" };
            ctx.fillText(icons[space.type] || "🏖️", 256, 440);

            // Badge Harga Beli (Pill Hijau Zamrud dengan Teks Putih Tebal)
            if (space.price) {
                const px = 64, py = 575, pw = 384, ph = 80;
                ctx.fillStyle = "#064e3b";
                ctx.beginPath();
                ctx.arc(px + 40, py + 40, 40, Math.PI / 2, Math.PI * 1.5);
                ctx.arc(px + pw - 40, py + 40, 40, Math.PI * 1.5, Math.PI / 2);
                ctx.closePath();
                ctx.fill();

                ctx.strokeStyle = "#10b981";
                ctx.lineWidth = 5;
                ctx.stroke();

                ctx.fillStyle = "#ffffff";
                ctx.font = "900 36px sans-serif";
                ctx.fillText(`Rp ${space.price.toLocaleString('id-ID')}`, 256, py + 42);
            }

            const texture = new THREE.CanvasTexture(canvas);
            texture.anisotropy = 16;
            return texture;
        };

        const createDiceTexture = (number) => {
            const canvas = document.createElement('canvas');
            canvas.width = 128; canvas.height = 128;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = "#f8fafc"; ctx.fillRect(0, 0, 128, 128);
            ctx.strokeStyle = "#cbd5e1"; ctx.lineWidth = 8; ctx.strokeRect(4, 4, 120, 120);

            ctx.fillStyle = number === 1 ? "#dc2626" : "#0f172a";
            const drawDot = (x, y, r = 12) => { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); };
            const c = 64, l = 32, r = 96;
            if (number === 1) drawDot(c, c, 16);
            if (number === 2) { drawDot(l, l); drawDot(r, r); }
            if (number === 3) { drawDot(l, l); drawDot(c, c); drawDot(r, r); }
            if (number === 4) { drawDot(l, l); drawDot(r, l); drawDot(l, r); drawDot(r, r); }
            if (number === 5) { drawDot(l, l); drawDot(r, l); drawDot(c, c); drawDot(l, r); drawDot(r, r); }
            if (number === 6) { drawDot(l, l); drawDot(r, l); drawDot(l, c); drawDot(r, c); drawDot(l, r); drawDot(r, r); }

            return new THREE.CanvasTexture(canvas);
        };

            const createPlayerPawnMesh = (colorHex, tokenChar) => {

                            bctx.beginPath(); bctx.arc(48, 48, 44, 0, Math.PI * 2); bctx.fill();
                            bctx.strokeStyle = "#ffffff"; bctx.lineWidth = 6; bctx.stroke();
                            bctx.font = "52px sans-serif"; bctx.textAlign = "center"; bctx.textBaseline = "middle";

                            bSprite.position.set(0, 0.9, 1.6);

                            // Ikon Gembok jika Terhipotek
                            if (space.mortgaged) {
                                const lCvs = document.createElement('canvas');

                                lctx.font = "36px sans-serif"; lctx.textAlign = "center"; lctx.textBaseline = "middle";
                                lctx.fillText("🔒", 32, 34);
                                const lSprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(lCvs) }));
                                lSprite.position.set(0, 1.5, 0);
                                lSprite.scale.set(0.8, 0.8, 0.8);
                                markerGroup.add(lSprite);
                            }

                            markerGroup.position.set(coords.x, 1.5, coords.z);
                            markerGroup.rotation.y = coords.rotY;
                            group.add(markerGroup);
                        }
                    }

                    // B. Bangunan 3D Rumah Hijau & Hotel Merah
                    if (space.type === 'property' && (space.houses > 0 || space.hotel)) {
                        if (space.hotel) {
                            const hGroup = new THREE.Group();
                            const bMesh = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.8, 0.8), new THREE.MeshStandardMaterial({ color: 0xdc2626, roughness: 0.3 }));
                            bMesh.position.y = 0.4; hGroup.add(bMesh);
                            const rMesh = new THREE.Mesh(new THREE.ConeGeometry(0.9, 0.7, 4), new THREE.MeshStandardMaterial({ color: 0xf59e0b, roughness: 0.2 }));
                            rMesh.position.y = 1.15; rMesh.rotation.y = Math.PI / 4; hGroup.add(rMesh);
                            hGroup.position.set(coords.x, 1.6, coords.z);
                            hGroup.rotation.y = coords.rotY;
                            group.add(hGroup);
                        } else {
                            for (let h = 0; h < space.houses; h++) {
                                const houseGroup = new THREE.Group();
                                const b = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.4, 0.5), new THREE.MeshStandardMaterial({ color: 0x10b981, roughness: 0.3 }));
                                b.position.y = 0.2; houseGroup.add(b);
                                const r = new THREE.Mesh(new THREE.ConeGeometry(0.42, 0.35, 4), new THREE.MeshStandardMaterial({ color: 0x064e3b, roughness: 0.4 }));
                                r.position.y = 0.55; r.rotation.y = Math.PI / 4; houseGroup.add(r);
                                const offset = (h - (space.houses - 1) / 2) * 0.55;
                                houseGroup.position.set(coords.x + offset, 1.6, coords.z);
                                houseGroup.rotation.y = coords.rotY;
                                group.add(houseGroup);
                            }
                        }
                    }
                });
            }, [board, players, freeParkingPot, screen]);

            // Animasi Dadu 3D
            const roll3DDice = (d1, d2, onComplete) => {
                const dice = diceMeshesRef.current;
                if (!dice || dice.length < 2) { onComplete(); return; }
                setIsRolling(true); playSoundEffect('dice');

                const faceRotations = {
                    1: { x: 0, z: Math.PI / 2 }, 2: { x: 0, z: 0 }, 3: { x: -Math.PI / 2, z: 0 },
                    4: { x: Math.PI / 2, z: 0 }, 5: { x: Math.PI, z: 0 }, 6: { x: 0, z: -Math.PI / 2 }
                };

                const targetRot1 = faceRotations[d1] || { x: 0, z: 0 };
                const targetRot2 = faceRotations[d2] || { x: 0, z: 0 };

                dice.forEach((die, i) => {
                    const isLeft = i === 0;
                    die.position.set(isLeft ? -4 : 4, 8, isLeft ? 3 : -3);
                    const targetRot = isLeft ? targetRot1 : targetRot2;
                    const fullSpins = (Math.PI * 2) * 3;

                    new window.TWEEN.Tween(die.position)
                        .to({ y: 2.3, x: isLeft ? -1.8 : 1.8, z: 0 }, 750)
                        .easing(window.TWEEN.Easing.Bounce.Out).start();

                    new window.TWEEN.Tween(die.rotation)
                        .to({ x: targetRot.x + fullSpins, y: fullSpins + (Math.random() * 0.5), z: targetRot.z + fullSpins }, 750)
                        .easing(window.TWEEN.Easing.Cubic.Out)
                        .onComplete(() => { if (i === 1) { setIsRolling(false); onComplete(); } }).start();
                });
            };

            // Animasi Bidak Melompat Parabola
            const animatePawnMovement = (playerId, fromPos, steps, onComplete) => {
                const pawn = playerMeshesRef.current[playerId];
                if (!pawn) { onComplete(); return; }
                setIsMoving(true);
                let currentStep = 0;

                const stepNext = () => {
                    if (currentStep >= steps) { setIsMoving(false); onComplete(); return; }
                    currentStep++;
                    const nextTileId = (fromPos + currentStep) % 40;
                    const targetCoords = getTileCoordinates(nextTileId);
                    const startX = pawn.position.x;
                    const startZ = pawn.position.z;
                    playSoundEffect('hop');

                    const startTime = performance.now();
                    const duration = 280;
                    const hopAnim = (now) => {
                        const elapsed = now - startTime;
                        const progress = Math.min(elapsed / duration, 1);
                        pawn.position.x = startX + (targetCoords.x - startX) * progress;
                        pawn.position.z = startZ + (targetCoords.z - startZ) * progress;
                        pawn.position.y = 1.6 + Math.sin(progress * Math.PI) * 2.8;

                        if (progress < 1) requestAnimationFrame(hopAnim);
                        else { pawn.position.y = 1.6; setTimeout(stepNext, 50); }
                    };
                    requestAnimationFrame(hopAnim);
                };
                stepNext();
            };

            // Lempar Dadu & Gerak Otomatis
            const handleRollDice = () => {
                if (isRolling || isMoving || turnPhase !== 'ROLL') return;
                const d1 = Math.floor(Math.random() * 6) + 1;
                const d2 = Math.floor(Math.random() * 6) + 1;
                const total = d1 + d2;
                const isDouble = d1 === d2;

                setCurrentRoll([d1, d2]);
                roll3DDice(d1, d2, () => {
                    addLog(`${currentPlayer.name} melempar ${d1} & ${d2} (Total: ${total})${isDouble ? ' • Kembar!' : ''}`);

                    // Cek jika sedang di Penjara
                    if (currentPlayer.inJail) {
                        if (isDouble) {
                            addLog(`${currentPlayer.name} bebas dari penjara karena mendapat dadu kembar!`);
                            updatePlayer(currentPlayer.id, { inJail: false, jailTurns: 0 });
                        } else {
                            const newJailTurns = (currentPlayer.jailTurns || 0) + 1;
                            addLog(`${currentPlayer.name} gagal bebas dari penjara (putaran ke-${newJailTurns}).`);
                            updatePlayer(currentPlayer.id, { jailTurns: newJailTurns });
                            setTurnPhase('END');
                            return;
                        }
                    }

                    const startPos = currentPlayer.position;
                    animatePawnMovement(currentPlayer.id, startPos, total, () => {
                        const finalPos = (startPos + total) % 40;
                        updatePlayer(currentPlayer.id, { position: finalPos });

                        // Tangani bonus GO & Pajak Aset Properti
                        if (startPos + total >= 40) {
                            const baseReward = finalPos === 0 ? 30000 : 20000;
                            const assetTax = calculateGoPropertyTax(currentPlayer.id, board);
                            const netReward = baseReward - assetTax;

                            if (assetTax > 0) {
                                adjustPlayerMoney(currentPlayer.id, netReward);
                                setFreeParkingPot(prev => prev + assetTax);
                                triggerMoneyAnimation(netReward, 'GO (Potong Pajak Aset)', { from: 'Bank', to: currentPlayer.name });
                                addLog(`${currentPlayer.name} lewat GO. Bonus Rp ${baseReward.toLocaleString('id-ID')} dipotong Pajak Aset Rp ${assetTax.toLocaleString('id-ID')} ke Jackpot.`);
                            } else {
                                adjustPlayerMoney(currentPlayer.id, baseReward);
                                triggerMoneyAnimation(baseReward, 'Bonus GO', { from: 'Bank', to: currentPlayer.name });
                                addLog(`${currentPlayer.name} ${finalPos === 0 ? 'berhenti di' : 'lewat'} GO, dapat Rp ${baseReward.toLocaleString('id-ID')}.`);
                            }
                        }
                        handleTileAction(finalPos, isDouble);
                    });
                });
            };

            // Tahan Dadu (Hold to Roll)
            const startHoldRoll = () => {
                if (isRolling || isMoving || turnPhase !== 'ROLL') return;
                setIsHoldingDice(true);
                setHoldProgress(0);
                const start = Date.now();
                holdIntervalRef.current = setInterval(() => {
                    const p = Math.min(100, Math.round(((Date.now() - start) / 800) * 100));
                    setHoldProgress(p);
                }, 40);
            };

            const endHoldRoll = () => {
                if (!isHoldingDice) return;
                clearInterval(holdIntervalRef.current);
                setIsHoldingDice(false);
                setHoldProgress(0);
                handleRollDice();
            };

            // Bayar Sogok Penjara Rp 5.000
            const payJailBribeAndRoll = () => {
                if (!currentPlayer?.inJail || isRolling || isMoving) return;
                if (currentPlayer.money < JAIL_BRIBE_COST) {
                    alert(`Uang tidak cukup. Butuh Rp ${JAIL_BRIBE_COST.toLocaleString('id-ID')} untuk bayar denda keluar penjara.`);
                    return;
                }
                updatePlayer(currentPlayer.id, { inJail: false, jailTurns: 0 });
                adjustPlayerMoney(currentPlayer.id, -JAIL_BRIBE_COST);
                setFreeParkingPot(prev => prev + JAIL_BRIBE_COST);
                triggerMoneyAnimation(-JAIL_BRIBE_COST, 'Denda Penjara', { from: currentPlayer.name, to: 'Jackpot' });
                addLog(`${currentPlayer.name} membayar jaminan denda Rp ${JAIL_BRIBE_COST.toLocaleString('id-ID')} ke kas Jackpot untuk langsung bebas!`);
                handleRollDice();
            };

            // Pilihan Parkir Bebas
            const chooseParkingJackpot = () => {
                const claimAmount = Math.min(freeParkingPot, FREE_PARKING_CLAIM_LIMIT);
                if (claimAmount > 0) {
                    adjustPlayerMoney(currentPlayer.id, claimAmount);
                    setFreeParkingPot(prev => prev - claimAmount);
                    triggerMoneyAnimation(claimAmount, 'Jackpot Parkir', { from: 'Jackpot', to: currentPlayer.name });
                    addLog(`${currentPlayer.name} mengklaim Jackpot Parkir Bebas Rp ${claimAmount.toLocaleString('id-ID')}!`);
                }
                setParkingChoiceActive(false);
                setTurnPhase('END');
            };

            const chooseParkingDestination = (targetId) => {
                const targetSpace = board.find(s => s.id === targetId);
                if (!targetSpace) return;
                setParkingChoiceActive(false);

                if (targetId < currentPlayer.position) {
                    adjustPlayerMoney(currentPlayer.id, 20000);
                    triggerMoneyAnimation(20000, 'Bonus GO', { from: 'Bank', to: currentPlayer.name });
                }
                updatePlayer(currentPlayer.id, { position: targetId });
                const pawn = playerMeshesRef.current[currentPlayer.id];
                if (pawn) {
                    const coords = getTileCoordinates(targetId);
                    pawn.position.set(coords.x, 1.6, coords.z);
                }
                addLog(`${currentPlayer.name} terbang ke ${targetSpace.name} dari Parkir Bebas!`);
                setTimeout(() => handleTileAction(targetId, false), 400);
            };

            // Aksi Petak
            const handleTileAction = (tileId, isDouble) => {
                const space = board[tileId];
                if (!space) return;

                if (isOwnable(space)) {
                    if (space.owner === undefined) {
                        if (currentPlayer.isBot) {
                            if (currentPlayer.money >= space.price + 20000) {
                                buyProperty(space, currentPlayer.id);
                            }
                            finishTurnAction(isDouble);
                        } else {
                            setSelectedActionSpace(space);
                            setTurnPhase('ACTION');
                        }
                    } else if (space.owner !== currentPlayer.id) {
                        if (space.mortgaged) {
                            addLog(`${space.name} sedang terhipotek (bebas sewa).`);
                            finishTurnAction(isDouble);
                            return;
                        }
                        const owner = players[space.owner];
                        let rent = space.rent || 1000;
                        if (space.type === 'property') {
                            const multipliers = [1, 3, 7, 14, 24];
                            rent = space.hotel ? rent * 40 : rent * multipliers[space.houses || 0];
                            if (hasCompleteColorGroup(space, board)) rent = Math.ceil(rent * COMPLETE_COLOR_RENT_MULTIPLIER);
                            if (touristSeasonTurns > 0 && [1, 26, 29].includes(space.id)) rent *= 2;
                        } else if (space.type === 'port') {
                            const ownedPorts = board.filter(b => b.type === 'port' && b.owner === owner.id).length || 1;
                            rent = space.rent * ownedPorts;
                        } else if (space.type === 'utility') {
                            const ownedUtils = board.filter(b => b.type === 'utility' && b.owner === owner.id).length || 1;
                            rent = (currentRoll[0] + currentRoll[1]) * (ownedUtils > 1 ? 1000 : 400);
                        }

                        // Manajemen Hutang jika uang tidak cukup
                        if (currentPlayer.money < rent) {
                            triggerDebtEmergency(currentPlayer.id, owner.id, rent, `Sewa ${space.name}`);
                            return;
                        }

                        adjustPlayerMoney(currentPlayer.id, -rent);
                        adjustPlayerMoney(owner.id, rent);
                        triggerMoneyAnimation(rent, 'Sewa', { from: currentPlayer.name, to: owner.name });
                        setTurnSummary({ title: `Bayar Sewa ${space.name}`, detail: `${currentPlayer.name} membayar sewa kepada ${owner.name}.`, amount: -rent, tone: 'pay' });
                        addLog(`${currentPlayer.name} membayar sewa Rp ${rent.toLocaleString('id-ID')} kepada ${owner.name}.`);
                        finishTurnAction(isDouble);
                    } else {
                        finishTurnAction(isDouble);
                    }
                } else if (['chance', 'chest'].includes(space.type)) {
                    // Ambil kartu dari deck
                    const isChance = space.type === 'chance';
                    let deck = isChance ? [...cardDecks.chance] : [...cardDecks.chest];
                    if (deck.length === 0) deck = shuffleDeck(isChance ? chanceCards.length : chestCards.length);
                    const cardIndex = deck.pop();
                    setCardDecks(prev => ({ ...prev, [isChance ? 'chance' : 'chest']: deck }));

                    const card = (isChance ? chanceCards : chestCards)[cardIndex];
                    animate3DCardDraw(isChance, card, () => {
                        setActiveCard(card);
                        setTurnPhase('CARD');
                        addLog(`Kartu: ${card.text}`);
                        if (currentPlayer.isBot) setTimeout(() => applyCard(card, isDouble), 2000);
                    });
                } else if (space.type === 'tax') {
                    if (currentPlayer.money < space.price) {
                        triggerDebtEmergency(currentPlayer.id, null, space.price, 'Pajak Daerah');
                        return;
                    }
                    adjustPlayerMoney(currentPlayer.id, -space.price);
                    setFreeParkingPot(prev => prev + space.price);
                    triggerMoneyAnimation(space.price, 'Pajak Daerah', { from: currentPlayer.name, to: 'Jackpot' });
                    setTurnSummary({ title: 'Bayar Pajak', detail: `${currentPlayer.name} membayar pajak ke Jackpot.`, amount: -space.price, tone: 'pay' });
                    finishTurnAction(isDouble);
                } else if (space.type === 'parking') {
                    if (currentPlayer.isBot) {
                        chooseParkingJackpot();
                        finishTurnAction(isDouble);
                    } else {
                        setParkingChoiceActive(true);
                    }
                } else if (space.type === 'gotojail') {
                    sendToJail(currentPlayer.id);
                    finishTurnAction(false);
                } else {
                    finishTurnAction(isDouble);
                }
            };

            // Manajemen Hutang
            const triggerDebtEmergency = (debtorId, creditorId, amount, reason) => {
                setDebtAction({ playerId: debtorId, creditorId, amount, reason });
                setTurnPhase('DEBT');
                addLog(`⚠️ PERINGATAN KRISIS: ${players[debtorId].name} kekurangan kas untuk membayar Rp ${amount.toLocaleString('id-ID')} (${reason})!`);
            };

            const mortgageProperty = (spaceId, playerId) => {
                const space = board.find(s => s.id === spaceId);
                if (!space || space.owner !== playerId || space.mortgaged) return;
                const val = Math.round(space.price * 0.5);
                adjustPlayerMoney(playerId, val);
                setBoard(prev => prev.map(s => s.id === spaceId ? { ...s, mortgaged: true } : s));
                triggerMoneyAnimation(val, 'Gadai Tanah', { from: 'Bank', to: players[playerId].name });
                addLog(`${players[playerId].name} menggadaikan ${space.name} seharga Rp ${val.toLocaleString('id-ID')}.`);
            };

            const unmortgageProperty = (spaceId, playerId) => {
                const space = board.find(s => s.id === spaceId);
                if (!space || space.owner !== playerId || !space.mortgaged) return;
                const cost = Math.round(space.price * 0.55);
                if (players[playerId].money < cost) return;
                adjustPlayerMoney(playerId, -cost);
                setBoard(prev => prev.map(s => s.id === spaceId ? { ...s, mortgaged: false } : s));
                triggerMoneyAnimation(cost, 'Tebus Gadai', { from: players[playerId].name, to: 'Bank' });
                addLog(`${players[playerId].name} menebus gadai ${space.name} seharga Rp ${cost.toLocaleString('id-ID')}.`);
            };

            const sellOneBuilding = (spaceId, playerId) => {
                const space = board.find(s => s.id === spaceId);
                if (!space || space.owner !== playerId) return;
                const refund = Math.round(getBuildCost(space) * SELL_BACK_RATE);
                adjustPlayerMoney(playerId, refund);
                setBoard(prev => prev.map(s => {
                    if (s.id !== spaceId) return s;
                    if (s.hotel) return { ...s, hotel: false, houses: 4 };
                    if (s.houses > 0) return { ...s, houses: s.houses - 1 };
                    return s;
                }));
                triggerMoneyAnimation(refund, 'Jual Bangunan', { from: 'Bank', to: players[playerId].name });
                addLog(`${players[playerId].name} menjual bangunan di ${space.name} seharga Rp ${refund.toLocaleString('id-ID')}.`);
            };

            const payDebtNow = () => {
                if (!debtAction) return;
                const debtor = players[debtAction.playerId];
                if (debtor.money < debtAction.amount) {
                    alert("Saldo kas Anda masih belum cukup. Silakan gadaikan tanah atau jual bangunan terlebih dahulu!");
                    return;
                }
                adjustPlayerMoney(debtAction.playerId, -debtAction.amount);
                if (debtAction.creditorId !== null && debtAction.creditorId !== undefined) {
                    adjustPlayerMoney(debtAction.creditorId, debtAction.amount);
                    triggerMoneyAnimation(debtAction.amount, 'Lunas Utang', { from: debtor.name, to: players[debtAction.creditorId].name });
                } else {
                    setFreeParkingPot(prev => prev + debtAction.amount);
                    triggerMoneyAnimation(debtAction.amount, 'Lunas Pajak', { from: debtor.name, to: 'Jackpot' });
                }
                addLog(`${debtor.name} berhasil melunasi kewajiban Rp ${debtAction.amount.toLocaleString('id-ID')}!`);
                setDebtAction(null);
                setTurnPhase('END');
            };

            const declareBankruptcy = () => {
                if (!debtAction) return;
                const debtor = players[debtAction.playerId];
                addLog(`💀 KEBANGKRUTAN: ${debtor.name} resmi bangkrut dan tersingkir dari arena!`);
                setBoard(prev => prev.map(s => s.owner === debtor.id ? { ...s, owner: undefined, houses: 0, hotel: false, mortgaged: false } : s));
                updatePlayer(debtor.id, { bankrupt: true, money: 0, position: -1 });
                setDebtAction(null);

                const active = players.filter(p => !p.bankrupt && p.id !== debtor.id);
                if (active.length <= 1) {
                    setWinner(active[0] || currentPlayer);
                    setTurnPhase('WIN');
                } else {
                    setTurnPhase('END');
                }
            };

            const buyProperty = (space, buyerId) => {
                adjustPlayerMoney(buyerId, -space.price);
                triggerMoneyAnimation(space.price, 'Beli Kavling', { from: players[buyerId].name, to: 'Bank' });
                setBoard(prev => prev.map(s => s.id === space.id ? { ...s, owner: buyerId } : s));
                addLog(`${players[buyerId].name} membeli ${space.name} seharga Rp ${space.price.toLocaleString('id-ID')}.`);
            };

            const buildHouse = (spaceId) => {
                const space = board[spaceId];
                if (!hasCompleteColorGroup(space, board)) {
                    alert("Anda wajib menguasai seluruh kavling dalam kelompok warna ini terlebih dahulu!");
                    return;
                }
                const cost = getBuildCost(space);
                if (currentPlayer.money < cost) return;

                adjustPlayerMoney(currentPlayer.id, -cost);
                setBoard(prev => prev.map(s => {
                    if (s.id !== spaceId) return s;
                    if ((s.houses || 0) < 4) return { ...s, houses: (s.houses || 0) + 1 };
                    return { ...s, houses: 0, hotel: true };
                }));
                triggerMoneyAnimation(cost, 'Bangun Properti', { from: currentPlayer.name, to: 'Bank' });
                addLog(`${currentPlayer.name} mendirikan bangunan di ${space.name}!`);
            };

            const applyCard = (card, isDouble) => {
                if (card.action === 'tourist_season') {
                    setTouristSeasonTurns(players.length * 2);
                    addLog(`🌴 EVENT AKTIF: Musim Liburan Turis! Sewa Kuta, Seminyak, Canggu melonjak 2x lipat!`);
                } else if (card.action === 'money') {
                    adjustPlayerMoney(currentPlayer.id, card.amount);
                    triggerMoneyAnimation(card.amount, 'Efek Kartu', { from: card.amount > 0 ? 'Bank' : currentPlayer.name, to: card.amount > 0 ? currentPlayer.name : 'Bank' });
                } else if (card.action === 'move') {
                    const pawn = playerMeshesRef.current[currentPlayer.id];
                    if (pawn) {
                        const coords = getTileCoordinates(card.target);
                        pawn.position.set(coords.x, 1.6, coords.z);
                    }
                    updatePlayer(currentPlayer.id, { position: card.target });
                } else if (card.action === 'jail') {
                    sendToJail(currentPlayer.id);
                    setActiveCard(null);
                    finishTurnAction(false);
                    return;
                } else if (card.action === 'renovation_fee') {
                    const myAssets = board.filter(b => b.owner === currentPlayer.id);
                    const fee = myAssets.reduce((sum, s) => sum + ((s.houses || 0) * 3000) + (s.hotel ? 10000 : 0), 0);
                    if (fee > 0) {
                        adjustPlayerMoney(currentPlayer.id, -fee);
                        setFreeParkingPot(p => p + fee);
                        triggerMoneyAnimation(-fee, 'Renovasi', { from: currentPlayer.name, to: 'Jackpot' });
                    }
                } else if (card.action === 'conditional_aid') {
                    const aid = currentPlayer.money < 50000 ? 25000 : 5000;
                    adjustPlayerMoney(currentPlayer.id, aid);
                    triggerMoneyAnimation(aid, 'Bantuan Warga', { from: 'Bank', to: currentPlayer.name });
                } else if (card.action === 'asset_dividend') {
                    const count = board.filter(b => b.owner === currentPlayer.id).length;
                    const div = count * 2000;
                    if (div > 0) {
                        adjustPlayerMoney(currentPlayer.id, div);
                        triggerMoneyAnimation(div, 'Dividen Aset', { from: 'Bank', to: currentPlayer.name });
                    }
                }
                setActiveCard(null);
                finishTurnAction(isDouble);
            };

            const sendToJail = (playerId) => {
                updatePlayer(playerId, { position: 10, inJail: true, jailTurns: 0 });
                const pawn = playerMeshesRef.current[playerId];
                if (pawn) {
                    const coords = getTileCoordinates(10);
                    pawn.position.set(coords.x, 1.6, coords.z);
                }
                addLog(`${players[playerId].name} dijebloskan ke Penjara Kerobokan!`);
            };

            const finishTurnAction = (isDouble) => {
                setSelectedActionSpace(null);
                if (isDouble) {
                    setTurnPhase('ROLL');
                    setTurnSummary({ title: "Dadu Kembar!", detail: `${currentPlayer.name} berhak melempar dadu lagi.`, amount: null, tone: "gain" });
                } else {
                    setTurnPhase('END');
                    setTurnSummary({ title: "Selesai Aksi", detail: "Giliran akan otomatis berpindah dalam 5 detik.", amount: null, tone: "neutral" });
                }
            };

            const endTurn = () => {
                const active = players.filter(p => !p.bankrupt);
                if (active.length <= 1) {
                    setWinner(active[0] || currentPlayer);
                    setTurnPhase('WIN');
                    return;
                }

                setTouristSeasonTurns(prev => Math.max(0, prev - 1));
                setTotalTurnsCount(prev => prev + 1);

                let nextIndex = (turnIndex + 1) % players.length;
                while (players[nextIndex].bankrupt) {
                    nextIndex = (nextIndex + 1) % players.length;
                }

                setTurnIndex(nextIndex);
                setTurnPhase('ROLL');
                setTurnSummary({ title: `Giliran ${players[nextIndex].name}`, detail: "Kocok dadu 3D untuk melangkah.", amount: null, tone: "neutral" });
                addLog(`Giliran berganti ke ${players[nextIndex].name}.`);
            };

            // Auto-End Turn 5s
            React.useEffect(() => {
                if (turnPhase !== 'END') { setAutoEndCountdown(5); return; }
                setAutoEndCountdown(5);
                const timer = setInterval(() => setAutoEndCountdown(prev => Math.max(0, prev - 1)), 1000);
                const timeout = setTimeout(() => endTurn(), 5000);
                return () => { clearInterval(timer); clearTimeout(timeout); };
            }, [turnPhase, turnIndex]);

            // Bot Otomatis
            React.useEffect(() => {
                if (screen !== 'GAME' || !currentPlayer.isBot || isRolling || isMoving) return;
                if (turnPhase === 'ROLL') {
                    if (currentPlayer.inJail && currentPlayer.money >= JAIL_BRIBE_COST + 15000) {
                        setTimeout(() => payJailBribeAndRoll(), 800);
                    } else {
                        setTimeout(() => handleRollDice(), 1200);
                    }
                } else if (turnPhase === 'END') {
                    setTimeout(() => endTurn(), 1000);
                } else if (turnPhase === 'DEBT') {
                    // Bot darurat jual aset
                    setTimeout(() => {
                        const myAssets = board.filter(s => s.owner === currentPlayer.id);
                        const buildingAsset = myAssets.find(s => s.houses > 0 || s.hotel);
                        if (buildingAsset) { sellOneBuilding(buildingAsset.id, currentPlayer.id); return; }
                        const unmortgaged = myAssets.find(s => !s.mortgaged);
                        if (unmortgaged) { mortgageProperty(unmortgaged.id, currentPlayer.id); return; }
                        if (currentPlayer.money >= debtAction.amount) { payDebtNow(); return; }
                        declareBankruptcy();
                    }, 1000);
                }
            }, [turnPhase, turnIndex, screen, isRolling, isMoving, debtAction]);

            const updatePlayer = (id, changes) => {
                setPlayers(prev => prev.map(p => p.id === id ? { ...p, ...changes } : p));
            };

            const adjustPlayerMoney = (id, amount) => {
                setPlayers(prev => prev.map(p => {
                    if (p.id !== id) return p;
                    return { ...p, money: p.money + amount };
                }));
            };

            const startGame = () => {
                const initPlayers = (lobbyPlayers.length >= 2 ? lobbyPlayers : players).map((p, idx) => ({
                    id: idx,
                    setupId: p.setupId,
                    name: p.name || `Pemain ${idx + 1}`,
                    token: p.token,
                    color: p.color,
                    money: startingMoney,
                    position: 0,
                    isBot: p.isBot || false,
                    inJail: false,
                    bankrupt: false
                }));
                setPlayers(initPlayers);
                setTurnIndex(0);
                setTurnPhase('ROLL');
                setTotalTurnsCount(1);
                setTouristSeasonTurns(0);
                setScreen('GAME');
            };

            const setCameraView = (type) => {
                const cam = threeSceneRef.current?.camera;
                const ctrl = threeSceneRef.current?.controls;
                if (!cam || !ctrl) return;
                if (type === 'orbit') {
                    new window.TWEEN.Tween(cam.position).to({ x: 0, y: 34, z: 32 }, 600).start();
                    ctrl.target.set(0, 0, 0);
                } else if (type === 'top') {
                    new window.TWEEN.Tween(cam.position).to({ x: 0, y: 48, z: 0.1 }, 600).start();
                    ctrl.target.set(0, 0, 0);
                } else if (type === 'pawn') {
                    const pawn = playerMeshesRef.current[currentPlayer.id];
                    if (pawn) {
                        new window.TWEEN.Tween(cam.position).to({ x: pawn.position.x + 8, y: pawn.position.y + 12, z: pawn.position.z + 12 }, 600).start();
                        ctrl.target.copy(pawn.position);
                    }
                }
            };

            const calcNetWorth = (p) => {
                const assets = board.filter(s => s.owner === p.id);
                return Math.max(0, p.money) + assets.reduce((sum, s) => sum + (s.price || 0) + ((s.houses || 0) * 10000), 0);
            };

            const selectedInfoSpace = selectedInfoSpaceId !== null ? board[selectedInfoSpaceId] : null;
            const rentInfo = selectedInfoSpace ? getRentBreakdown(selectedInfoSpace, board) : null;

            // --- 3. RENDER LAYAR LOGIN ---
            if (screen === 'LOGIN') {
                const lastSession = getLastOnlineSession();
                return (
                    <div className="w-full h-full flex items-center justify-center p-4 bg-gradient-to-br from-slate-950 via-slate-900 to-emerald-950">
                        <form onSubmit={handleLogin} className="max-w-md w-full glass-panel rounded-2xl overflow-hidden border border-emerald-500/40 shadow-2xl">
                            <div className="bg-emerald-900/90 text-white p-6 border-b border-emerald-600/40 text-center">
                                <span className="text-xs font-black uppercase tracking-widest text-emerald-300">Ultimate 3D Edition</span>
                                <h1 className="text-3xl font-black mt-1">Monopoli Bali 3D</h1>
                                <p className="text-xs text-emerald-200/80 mt-1">Papan 3D • Dadu Fisik • Multiplayer &amp; Ekonomi Penuh</p>
                            </div>
                            <div className="p-6 space-y-4">
                                {lastSession?.roomCode && (
                                    <button
                                        type="button"
                                        onClick={() => {
                                            setJoinCode(lastSession.roomCode);
                                            setLoginForm(prev => ({ ...prev, username: lastSession.playerName || "Player" }));
                                        }}
                                        className="w-full bg-amber-500/20 hover:bg-amber-500/30 text-amber-300 border border-amber-500/40 rounded-xl py-2.5 font-bold text-xs transition-all"
                                    >
                                        Lanjutkan Room: {lastSession.roomCode}
                                    </button>
                                )}
                                <label className="block">
                                    <span className="text-xs font-black uppercase text-slate-300">Nama Pemain</span>
                                    <input
                                        value={loginForm.username}
                                        onChange={(e) => setLoginForm(prev => ({ ...prev, username: e.target.value }))}
                                        className="mt-1 w-full rounded-xl bg-slate-800/90 border border-slate-700 px-4 py-3 font-bold text-white outline-none focus:border-emerald-500"
                                        placeholder="Masukkan nama pemain"
                                        required
                                    />
                                </label>
                                {setupError && <p className="text-xs font-bold text-red-400 bg-red-950/60 p-2.5 rounded-lg border border-red-800">{setupError}</p>}
                                <div className="grid grid-cols-2 gap-3 pt-2">
                                    <button type="submit" className="w-full bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-xl py-3 font-black shadow transition-all border border-slate-600">
                                        Main Lokal
                                    </button>
                                    <button type="button" onClick={createOnlineRoom} className="w-full bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl py-3 font-black shadow transition-all">
                                        Buat Room Online
                                    </button>
                                </div>
                                <div className="flex gap-2 pt-1 border-t border-slate-700/80">
                                    <input
                                        value={joinCode}
                                        onChange={(e) => setJoinCode(e.target.value)}
                                        placeholder="KODE ROOM"
                                        maxLength="6"
                                        className="w-1/3 rounded-xl bg-slate-800/90 border border-slate-700 px-3 py-2 font-black text-center text-amber-400 uppercase tracking-widest outline-none focus:border-amber-400 text-sm"
                                    />
                                    <button type="button" onClick={joinOnlineRoom} className="flex-1 bg-blue-600 hover:bg-blue-500 text-white rounded-xl py-2 font-black shadow transition-all text-xs uppercase tracking-wider">
                                        Gabung Online
                                    </button>
                                </div>
                                <button type="button" onClick={loadGame} className="w-full bg-slate-900/90 hover:bg-slate-800 text-slate-300 border border-slate-700 rounded-xl py-2.5 font-bold text-xs shadow transition-colors">
                                    📂 Load Save Game Lokal
                                </button>
                            </div>
                        </form>
                    </div>
                );
            }

            // --- 4. RENDER LAYAR LOBBY ---
            if (screen === 'LOBBY') {
                return (
                    <div className="w-full h-full flex items-center justify-center p-4 bg-gradient-to-br from-slate-950 via-slate-900 to-emerald-950 text-white">
                        <div className="max-w-2xl w-full glass-panel rounded-2xl p-6 shadow-2xl border border-emerald-500/40">
                            <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 border-b border-slate-700 pb-4 mb-5">
                                <div>
                                    <span className="px-2.5 py-0.5 bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 rounded-full text-[0.65rem] font-black uppercase tracking-wider">
                                        {isOnline ? `Online Room • Kode: ${roomCode}` : 'Mode Lokal (Hotseat)'}
                                    </span>
                                    <h1 className="text-2xl font-black mt-1 text-white">{roomName}</h1>
                                </div>
                                {isOnline && (
                                    <div className="bg-amber-400/20 text-amber-300 border border-amber-400/30 px-3 py-1.5 rounded-xl font-mono text-sm font-black tracking-widest">
                                        {roomCode}
                                    </div>
                                )}
                            </div>

                            {/* Pilihan Modal Awal */}
                            <div className="bg-slate-800/80 border border-slate-700 rounded-xl p-3.5 mb-5">
                                <span className="text-xs font-black uppercase text-amber-400 block mb-2">Pilihan Modal Awal:</span>
                                <div className="grid grid-cols-3 gap-2.5">
                                    {[
                                        { label: "⚡ Cepat", val: 100000, desc: "Rp 100.000" },
                                        { label: "⭐ Standar", val: 150000, desc: "Rp 150.000" },
                                        { label: "👑 Sultan", val: 250000, desc: "Rp 250.000" }
                                    ].map(item => (
                                        <button
                                            key={item.val}
                                            onClick={() => setStartingMoney(item.val)}
                                            className={`p-2 rounded-lg font-black text-xs transition-all border text-center ${startingMoney === item.val ? 'bg-emerald-600 text-white border-emerald-400 shadow-lg scale-102' : 'bg-slate-900/80 text-slate-300 border-slate-700 hover:bg-slate-700'}`}
                                        >
                                            {item.label}<br/><span className="text-[0.65rem] font-normal opacity-80">{item.desc}</span>
                                        </button>
                                    ))}
                                </div>
                            </div>

                            {/* Daftar Pemain */}
                            <div className="space-y-3 mb-6">
                                <div className="flex justify-between items-center text-xs font-bold text-slate-300">
                                    <span>DAFTAR PEMAIN ({lobbyPlayers.length}/6):</span>
                                    {(!isOnline || isHost) && lobbyPlayers.length < 6 && (
                                        <button 
                                            onClick={() => {
                                                const id = lobbyPlayers.length;
                                                const nextToken = tokenChoices[id % tokenChoices.length];
                                                const nextColor = playerColors[id % playerColors.length];
                                                setLobbyPlayers(prev => [...prev, { setupId: `bot-${Date.now()}`, name: `Bot ${id}`, token: nextToken, color: nextColor, isBot: true }]);
                                            }}
                                            className="text-emerald-400 hover:text-emerald-300 font-bold text-xs"
                                        >
                                            + Tambah Bot AI
                                        </button>
                                    )}
                                </div>
                                {lobbyPlayers.map((p, idx) => (
                                    <div key={p.setupId || idx} className="flex items-center gap-3 bg-slate-800/60 border border-slate-700 p-2.5 rounded-xl">
                                        <span className="w-8 h-8 rounded-lg flex items-center justify-center text-lg font-bold text-white shadow" style={{ backgroundColor: p.color }}>
                                            {p.token}
                                        </span>
                                        <span className="font-bold text-sm flex-1">{p.name}</span>
                                        <span className="text-xs px-2 py-0.5 rounded bg-slate-700 text-slate-300 font-semibold">
                                            {p.isBot ? "Bot AI" : "Pemain Asli"}
                                        </span>
                                    </div>
                                ))}
                            </div>

                            {(!isOnline || isHost) ? (
                                <button
                                    onClick={startGame}
                                    className="w-full bg-gradient-to-r from-emerald-600 to-teal-500 hover:from-emerald-500 text-white font-black py-4 rounded-xl shadow-xl transition-all transform hover:scale-[1.01] active:scale-95 text-base uppercase tracking-wider"
                                >
                                    🚀 Mulai Game 3D
                                </button>
                            ) : (
                                <div className="text-center p-3 font-bold text-slate-400 bg-slate-800/50 rounded-xl">
                                    Menunggu Host Memulai Game...
                                </div>
                            )}
                        </div>
                    </div>
                );
            }

            // --- 5. RENDER GAME 3D DENGAN HUD LENGKAP ---
            return (
                <div className="w-full h-full relative overflow-hidden bg-slate-950">
                    <div id="canvas3d-container" className="w-full h-full absolute inset-0 cursor-grab active:cursor-grabbing"></div>

                    {/* Uang Terbang */}
                    {moneyEffects.map((e) => (
                        <div key={e.id} className="cash-flyer">
                            <div className="rupiah-bill">
                                {e.amount > 0 ? '+' : ''} Rp {Math.abs(e.amount).toLocaleString('id-ID')}
                            </div>
                            <div className="transfer-route">{e.label}</div>
                        </div>
                    ))}

                    <div id="ui-overlay">
                        {/* Top Bar: Giliran & Kontrol */}
                        <div className="p-4 flex items-start justify-between">
                            <div className="interactive glass-panel rounded-2xl p-3 border-l-4 text-white flex items-center gap-3" style={{ borderLeftColor: currentPlayer.color }}>
                                <div className="text-2xl p-1.5 rounded-xl bg-slate-800/80 shadow">
                                    {currentPlayer.token}
                                </div>
                                <div>
                                    <div className="text-[0.7rem] font-bold text-slate-300 uppercase tracking-wider">
                                        Giliran #{totalTurnsCount}: <span className="text-amber-300">{currentPlayer.name}</span>
                                        {currentPlayer.inJail && <span className="ml-1 text-red-400 font-black">🔒 DIPENJARA</span>}
                                    </div>
                                    <div className="text-base font-black text-emerald-400">
                                        Rp {currentPlayer.money.toLocaleString('id-ID')}
                                    </div>
                                </div>
                        {/* Papan Informasi Permainan Utama di Tengah Layar */}
                        <div className="self-center interactive glass-panel rounded-2xl p-3.5 max-w-xl w-full mx-4 shadow-2xl border border-emerald-500/30 text-center">
                            <div className="flex items-center justify-between border-b border-slate-700/80 pb-2.5 mb-2.5 text-xs">
                                {/* Profil Pemain Aktif */}
                                <div className="flex items-center gap-2">
                                    <span className="text-2xl p-1.5 rounded-xl bg-slate-800 shadow" style={{ borderBottom: `3px solid ${currentPlayer.color || '#fff'}` }}>
                                        {currentPlayer.token}
                                    </span>
                                    <div className="text-left">
                                        <span className="text-[0.65rem] text-slate-400 font-black uppercase tracking-wider block">Giliran #{totalTurnsCount}</span>
                                        <span className="font-black text-amber-300 text-sm leading-tight block">
                                            {currentPlayer.name} {currentPlayer.isBot ? '(AI Bot)' : ''}
                                        </span>
                                    </div>
                                </div>

                                {/* Tampilan Dana Parkir Bebas di Tengah */}
                                <div className="px-3.5 py-1.5 bg-amber-500/20 border border-amber-400/50 rounded-xl text-center shadow-inner">
                                    <span className="text-[0.62rem] text-amber-300 font-black uppercase tracking-wider block">🅿️ DANA PARKIR BEBAS</span>
                                    <span className="text-sm font-black text-amber-300 drop-shadow">
                                        Rp {freeParkingPot.toLocaleString('id-ID')}
                                    </span>
                                </div>

                                {/* Saldo Kas Aktif */}
                                <div className="text-right">
                                    <span className="text-[0.65rem] text-slate-400 font-black uppercase tracking-wider block">Saldo Kas</span>
                                    <span className="text-sm font-black text-emerald-400 block leading-tight">
                                        Rp {currentPlayer.money ? currentPlayer.money.toLocaleString('id-ID') : 0}
                                    </span>
                                </div>
                            </div>

                            {/* Info Aksi Terkini (Turn Summary) */}
                            <div className="bg-slate-900/70 p-2.5 rounded-xl border border-slate-800 text-xs flex items-center justify-between">
                                <div className="text-left flex-1">
                                    <span className="font-extrabold text-white text-sm block mb-0.5">{turnSummary.title}</span>
                                    <p className="text-slate-300 leading-snug text-xs">{turnSummary.detail}</p>
                                </div>
                                <button
                                    onClick={() => setShowAssetDrawer(!showAssetDrawer)}
                                    className="ml-3 shrink-0 py-1.5 px-3 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg font-black text-[0.7rem] shadow transition-all flex items-center gap-1.5"
                                >
                                    <span>📋</span>
                                    <span>{showAssetDrawer ? 'Tutup Aset' : 'Aset Pemain'}</span>
                                </button>
                            </div>
                        </div>

                                        <div className="bg-slate-800/80 p-2.5 rounded-xl border border-slate-700">
                                            <span className="text-[0.65rem] text-slate-400 block">Total Putaran</span>
                                            <span className="text-lg font-black text-amber-400">{totalTurnsCount}</span>
                                        </div>
                                        <div className="bg-slate-800/80 p-2.5 rounded-xl border border-slate-700">
                                            <span className="text-[0.65rem] text-slate-400 block">Raja Properti</span>
                                            <span className="text-xs font-black text-emerald-400 truncate block">
                                                {[...players].sort((a,b) => board.filter(s=>s.owner===b.id).length - board.filter(s=>s.owner===a.id).length)[0]?.name}
                                            </span>
                                        </div>
                                        <div className="bg-slate-800/80 p-2.5 rounded-xl border border-slate-700">
                                            <span className="text-[0.65rem] text-slate-400 block">Pemain Terkaya</span>
                                            <span className="text-xs font-black text-blue-400 truncate block">
                                                {[...players].sort((a,b) => calcNetWorth(b) - calcNetWorth(a))[0]?.name}
                                            </span>
                                        </div>
                                    </div>

                                    <div className="bg-slate-800/50 rounded-xl overflow-hidden border border-slate-700 text-left mb-5">
                                        <div className="bg-slate-800 px-3 py-1.5 text-[0.7rem] font-black uppercase text-slate-400 flex justify-between">
                                            <span>Peringkat</span>
                                            <span>Total Nilai Aset</span>
                                        </div>
                                        <div className="divide-y divide-slate-700/50">
                                            {[...players].sort((a, b) => calcNetWorth(b) - calcNetWorth(a)).map((p, idx) => (
                                                <div key={p.id} className="p-2.5 flex items-center justify-between text-xs">
                                                    <div className="flex items-center gap-2">
                                                        <span className="w-5 h-5 rounded-full bg-slate-700 flex items-center justify-center font-bold text-[0.65rem]">#{idx + 1}</span>
                                                        <span className="text-base">{p.token}</span>
                                                        <div>
                                                            <span className="font-bold block leading-tight">{p.name}</span>
                                                            <span className="text-[0.65rem] text-slate-400">{p.bankrupt ? '💀 Bangkrut' : `${board.filter(s=>s.owner===p.id).length} Kavling`}</span>
                                                        </div>
                                                    </div>
                                                    <div className="text-right">
                                                        <span className="font-black text-emerald-400 block">Rp {calcNetWorth(p).toLocaleString('id-ID')}</span>
                                                        <span className="text-[0.65rem] text-slate-400">Kas: Rp {p.money.toLocaleString('id-ID')}</span>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    </div>

                                    <div className="grid grid-cols-2 gap-3">
                                        <button onClick={() => setScreen('LOBBY')} className="py-3 bg-slate-800 hover:bg-slate-700 rounded-xl font-black text-xs uppercase shadow">Lobby Utama</button>
                                        <button onClick={startGame} className="py-3 bg-gradient-to-r from-emerald-600 to-teal-500 rounded-xl font-black text-xs uppercase shadow">Main Lagi</button>
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
