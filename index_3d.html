        // --- 2. ENGINE THREE.JS UNTUK PAPAN, BIDAK, DADU, & BANGUNAN ---
        // Menghitung koordinat 3D untuk 40 petak pada papan 30x30 units
        const getTileCoordinates = (index) => {
            const side = 10;
            const halfSize = 13.5;
            const step = 2.7;

            if (index <= 10) {
                // Sisi Bawah (Index 0 s/d 10): Dari Kanan ke Kiri
                return { x: halfSize - (index * step), z: halfSize, rotY: 0 };
            } else if (index <= 20) {
                // Sisi Kiri (Index 10 s/d 20): Dari Bawah ke Atas
                const rel = index - 10;
                return { x: -halfSize, z: halfSize - (rel * step), rotY: Math.PI / 2 };
            } else if (index <= 30) {
                // Sisi Atas (Index 20 s/d 30): Dari Kiri ke Kanan
                const rel = index - 20;
                return { x: -halfSize + (rel * step), z: -halfSize, rotY: Math.PI };
            } else {
                // Sisi Kanan (Index 30 s/d 39): Dari Atas ke Bawah
                const rel = index - 30;
                return { x: halfSize, z: -halfSize + (rel * step), rotY: -Math.PI / 2 };
            }
        };

        // Buat tekstur petak dinamis dengan Canvas 2D beresolusi tinggi
        const createTileTexture = (space) => {
            const canvas = document.createElement('canvas');
            canvas.width = 256;
            canvas.height = 360;
            const ctx = canvas.getContext('2d');

            // Background
            ctx.fillStyle = "#ffffff";
            ctx.fillRect(0, 0, 256, 360);

            // Border
            ctx.strokeStyle = "#cbd5e1";
            ctx.lineWidth = 6;
            ctx.strokeRect(3, 3, 250, 354);

            // Color bar untuk properti
            if (space.type === 'property' && space.color) {
                ctx.fillStyle = space.color;
                ctx.fillRect(4, 4, 248, 80);
                ctx.strokeStyle = "rgba(0,0,0,0.3)";
                ctx.strokeRect(4, 4, 248, 80);
            } else {
                ctx.fillStyle = "#f1f5f9";
                ctx.fillRect(4, 4, 248, 60);
            }

            // Nama Petak
            ctx.fillStyle = "#0f172a";
            ctx.font = "bold 24px -apple-system, sans-serif";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";

            const words = space.name.split(" ");
            if (words.length > 1) {
                ctx.fillText(words.slice(0, 2).join(" "), 128, 140);
                if (words.slice(2).join(" ")) ctx.fillText(words.slice(2).join(" "), 128, 172);
            } else {
                ctx.fillText(space.name, 128, 150);
            }

            // Icon / Tipe
            ctx.font = "38px sans-serif";
            if (space.type === 'go') ctx.fillText("🏁", 128, 220);
            else if (space.type === 'port') ctx.fillText("🚢", 128, 220);
            else if (space.type === 'utility') ctx.fillText("⚡", 128, 220);
            else if (space.type === 'chance') ctx.fillText("❓", 128, 220);
            else if (space.type === 'chest') ctx.fillText("🎁", 128, 220);
            else if (space.type === 'jail') ctx.fillText("🔒", 128, 220);
            else if (space.type === 'gotojail') ctx.fillText("🚔", 128, 220);
            else if (space.type === 'parking') ctx.fillText("🅿️", 128, 220);
            else if (space.type === 'tax') ctx.fillText("💰", 128, 220);
            else ctx.fillText("🏖️", 128, 220);

            // Harga
            if (space.price) {
                ctx.fillStyle = "#047857";
                ctx.font = "bold 22px sans-serif";
                ctx.fillText(`Rp ${(space.price / 1000)}k`, 128, 310);
            }

            const texture = new THREE.CanvasTexture(canvas);
            texture.anisotropy = 8;
            return texture;
        };

        // Buat tekstur dadu 3D dengan 6 muka titik (pips)
        const createDiceTexture = (number) => {
            const canvas = document.createElement('canvas');
            canvas.width = 128;
            canvas.height = 128;
            const ctx = canvas.getContext('2d');

            // Background kubus putih rounded
            ctx.fillStyle = "#f8fafc";
            ctx.fillRect(0, 0, 128, 128);
            ctx.strokeStyle = "#cbd5e1";
            ctx.lineWidth = 8;
            ctx.strokeRect(4, 4, 120, 120);

            // Titik Dadu
            ctx.fillStyle = number === 1 ? "#dc2626" : "#0f172a";
            const drawDot = (x, y, r = 12) => {
                ctx.beginPath();
                ctx.arc(x, y, r, 0, Math.PI * 2);
                ctx.fill();
            };

            const c = 64, l = 32, r = 96;
            if (number === 1) drawDot(c, c, 16);
            if (number === 2) { drawDot(l, l); drawDot(r, r); }
            if (number === 3) { drawDot(l, l); drawDot(c, c); drawDot(r, r); }
            if (number === 4) { drawDot(l, l); drawDot(r, l); drawDot(l, r); drawDot(r, r); }
            if (number === 5) { drawDot(l, l); drawDot(r, l); drawDot(c, c); drawDot(l, r); drawDot(r, r); }
            if (number === 6) { drawDot(l, l); drawDot(r, l); drawDot(l, c); drawDot(r, c); drawDot(l, r); drawDot(r, r); }

            return new THREE.CanvasTexture(canvas);
        };

        // --- 3. KOMPONEN UTAMA GAME MONOPOLI 3D (REACT) ---
        const App = () => {
            const [screen, setScreen] = React.useState('LOBBY'); // LOBBY, GAME
            const [startingMoney, setStartingMoney] = React.useState(150000);
            const [players, setPlayers] = React.useState([
                { id: 0, name: "Anda", token: "🏄", color: "#ef4444", money: 150000, position: 0, isBot: false, inJail: false, jailTurns: 0 },

            const [autoEndCountdown, setAutoEndCountdown] = React.useState(5);

            const [totalTurnsCount, setTotalTurnsCount] = React.useState(1);

            const [activeCard, setActiveCard] = React.useState(null);
            const [selectedActionSpace, setSelectedActionSpace] = React.useState(null);
            const [logs, setLogs] = React.useState(["Selamat datang di Monopoli Bali 3D!"]);
            const [musicVolume, setMusicVolume] = React.useState(0.28);
            const [isSfxMuted, setIsSfxMuted] = React.useState(false);
            const [cameraMode, setCameraMode] = React.useState('orbit'); // orbit, top, follow

            // Refs untuk Three.js
            const canvasContainerRef = React.useRef(null);
            const threeSceneRef = React.useRef(null);
            const playerMeshesRef = React.useRef({});
            const diceMeshesRef = React.useRef([]);
            const buildingMeshesRef = React.useRef({});
            const backgroundMusicRef = React.useRef(null);

            const currentPlayer = players[turnIndex] || players[0];
            const canTakeAction = !currentPlayer.isBot && !currentPlayer.bankrupt;

            const addLog = (msg) => {
                setLogs(prev => [msg, ...prev.slice(0, 40)]);
            };

            // Audio setup
            React.useEffect(() => {
                const music = new Audio("Let's%20Get%20Rich%20theme%20song.mp3");
                music.loop = true;
                music.volume = musicVolume;
                backgroundMusicRef.current = music;
                const unlock = () => {
                    music.play().catch(() => {});
                    window.removeEventListener('pointerdown', unlock);
                };
                window.addEventListener('pointerdown', unlock, { once: true });
                return () => {
                    music.pause();
                    backgroundMusicRef.current = null;
                };
            }, []);

            React.useEffect(() => {
                if (backgroundMusicRef.current) {
                    backgroundMusicRef.current.volume = musicVolume;
                    if (musicVolume === 0) backgroundMusicRef.current.muted = true;
                    else backgroundMusicRef.current.muted = false;
                }
            }, [musicVolume]);

            const playSoundEffect = (type) => {
                if (isSfxMuted) return;
                try {
                    const ctx = new (window.AudioContext || window.webkitAudioContext)();
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    if (type === 'dice') {
                        osc.type = 'triangle';
                        osc.frequency.setValueAtTime(220, ctx.currentTime);
                        osc.frequency.exponentialRampToValueAtTime(110, ctx.currentTime + 0.15);
                        gain.gain.setValueAtTime(0.08, ctx.currentTime);
                        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.15);
                        osc.start();
                        osc.stop(ctx.currentTime + 0.15);
                    } else if (type === 'hop') {
                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(450, ctx.currentTime);
                        osc.frequency.exponentialRampToValueAtTime(600, ctx.currentTime + 0.08);
                        gain.gain.setValueAtTime(0.06, ctx.currentTime);
                        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.08);
                        osc.start();
                        osc.stop(ctx.currentTime + 0.08);
                    }
                } catch(e) {}
            };

            // Inisialisasi Dunia 3D Three.js
            React.useEffect(() => {
                if (screen !== 'GAME') return;

                const width = window.innerWidth;
                const height = window.innerHeight;

                const scene = new THREE.Scene();
                scene.background = new THREE.Color(0x0a101d);
                scene.fog = new THREE.FogExp2(0x0a101d, 0.015);

                const camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 1000);
                camera.position.set(0, 36, 32);

                const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
                renderer.setSize(width, height);
                renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
                renderer.shadowMap.enabled = true;
                renderer.shadowMap.type = THREE.PCFSoftShadowMap;

                const container = document.getElementById('canvas3d-container');
                if (container) {
                    container.innerHTML = '';
                    container.appendChild(renderer.domElement);
                }

                const controls = new THREE.OrbitControls(camera, renderer.domElement);
                controls.enableDamping = true;
                controls.dampingFactor = 0.05;
                controls.maxPolarAngle = Math.PI / 2 - 0.05;
                controls.minDistance = 12;
                controls.maxDistance = 75;

                // Lighting
                const ambientLight = new THREE.AmbientLight(0xffeedd, 0.75);
                scene.add(ambientLight);

                const dirLight = new THREE.DirectionalLight(0xfffaf0, 1.3);
                dirLight.position.set(22, 45, 22);
                dirLight.castShadow = true;
                dirLight.shadow.mapSize.width = 2048;
                dirLight.shadow.mapSize.height = 2048;
                dirLight.shadow.camera.near = 10;
                dirLight.shadow.camera.far = 100;
                dirLight.shadow.camera.left = -25;
                dirLight.shadow.camera.right = 25;
                dirLight.shadow.camera.top = 25;
                dirLight.shadow.camera.bottom = -25;
                dirLight.shadow.bias = -0.0005;
                scene.add(dirLight);

                const fillLight = new THREE.DirectionalLight(0x60a5fa, 0.35);
                fillLight.position.set(-20, 20, -20);
                scene.add(fillLight);

                // Meja Kayu Tropis
                const tableGeo = new THREE.PlaneGeometry(160, 160);
                const tableMat = new THREE.MeshStandardMaterial({ color: 0x070b14, roughness: 0.85 });
                const tableMesh = new THREE.Mesh(tableGeo, tableMat);
                tableMesh.rotation.x = -Math.PI / 2;
                tableMesh.position.y = -0.05;
                tableMesh.receiveShadow = true;
                scene.add(tableMesh);

                // Base Papan Monopoli 3D (Mahogany Board)
                const boardGroup = new THREE.Group();
                const baseGeo = new THREE.BoxGeometry(32, 1.4, 32);
                const baseMat = new THREE.MeshStandardMaterial({ color: 0x1f1610, roughness: 0.4, metalness: 0.1 });
                const baseMesh = new THREE.Mesh(baseGeo, baseMat);
                baseMesh.position.y = 0.7;
                baseMesh.receiveShadow = true;
                baseMesh.castShadow = true;
                boardGroup.add(baseMesh);

                // Trim Emas Pinggir Papan
                const trimGeo = new THREE.BoxGeometry(32.4, 0.15, 32.4);
                const trimMat = new THREE.MeshStandardMaterial({ color: 0xd97706, roughness: 0.2, metalness: 0.8 });
                const trimMesh = new THREE.Mesh(trimGeo, trimMat);
                trimMesh.position.y = 1.42;
                boardGroup.add(trimMesh);

                // Gambar Tengah Papan (Center Art)
                const centerTextureLoader = new THREE.TextureLoader();
                centerTextureLoader.load("Gemini_Generated_Image_djzwuldjzwuldjzw.png", (tex) => {
                    const centerGeo = new THREE.PlaneGeometry(21.4, 21.4);
                    const centerMat = new THREE.MeshStandardMaterial({ map: tex, roughness: 0.5 });
                    const centerMesh = new THREE.Mesh(centerGeo, centerMat);
                    centerMesh.rotation.x = -Math.PI / 2;
                    centerMesh.position.y = 1.44;
                    centerMesh.receiveShadow = true;
                    boardGroup.add(centerMesh);
                });

                // Generate 40 Petak 3D di Papan
                boardData.forEach((space) => {
                    const coords = getTileCoordinates(space.id);
                    const isCorner = [0, 10, 20, 30].includes(space.id);
                    const tileGeo = new THREE.BoxGeometry(isCorner ? 3.4 : 2.5, 0.18, isCorner ? 3.4 : 4.4);
                    const tileTexture = createTileTexture(space);
                    const materials = [
                        new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.5 }), // right
                        new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.5 }), // left
                        new THREE.MeshStandardMaterial({ map: tileTexture, roughness: 0.4 }), // top
                        new THREE.MeshStandardMaterial({ color: 0x111827 }),                 // bottom
                        new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.5 }), // front
                        new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.5 })  // back
                    ];
                    const tileMesh = new THREE.Mesh(tileGeo, materials);
                    tileMesh.position.set(coords.x, 1.45, coords.z);
                    tileMesh.rotation.y = coords.rotY;
                    tileMesh.receiveShadow = true;
                    tileMesh.userData = { spaceId: space.id };
                    boardGroup.add(tileMesh);
                });

                scene.add(boardGroup);

                // Buat 2 Dadu 3D
                const diceGroup = new THREE.Group();
                const dGeo = new THREE.BoxGeometry(1.6, 1.6, 1.6);
                for (let i = 0; i < 2; i++) {
                    const materials = [
                        new THREE.MeshStandardMaterial({ map: createDiceTexture(1), roughness: 0.2 }),
                        new THREE.MeshStandardMaterial({ map: createDiceTexture(6), roughness: 0.2 }),
                        new THREE.MeshStandardMaterial({ map: createDiceTexture(2), roughness: 0.2 }),
                        new THREE.MeshStandardMaterial({ map: createDiceTexture(5), roughness: 0.2 }),
                        new THREE.MeshStandardMaterial({ map: createDiceTexture(3), roughness: 0.2 }),
                        new THREE.MeshStandardMaterial({ map: createDiceTexture(4), roughness: 0.2 })
                    ];
                    const die = new THREE.Mesh(dGeo, materials);
                    die.castShadow = true;
                    die.position.set(i === 0 ? -1.8 : 1.8, 2.3, 0);
                    diceGroup.add(die);
                }
                scene.add(diceGroup);
                diceMeshesRef.current = diceGroup.children;

                // Buat Bidak / Pion 3D untuk setiap Pemain
                const playerGroup = new THREE.Group();
                playerMeshesRef.current = {};
                players.forEach((p, idx) => {
                    const pMesh = createPlayerPawnMesh(p.color, p.token);
                    const coords = getTileCoordinates(p.position || 0);
                    // Offset posisi agar pion tidak saling menumpuk jika di petak yang sama
                    const offsetX = (idx % 2 === 0 ? -0.4 : 0.4);
                    const offsetZ = (idx > 1 ? -0.4 : 0.4);
                    pMesh.position.set(coords.x + offsetX, 1.6, coords.z + offsetZ);
                    playerGroup.add(pMesh);
                    playerMeshesRef.current[p.id] = pMesh;
                });
                scene.add(playerGroup);

                threeSceneRef.current = { scene, camera, renderer, controls };

                // Handle resize
                const handleResize = () => {
                    const w = window.innerWidth;
                    const h = window.innerHeight;
                    camera.aspect = w / h;
                    camera.updateProjectionMatrix();
                    renderer.setSize(w, h);
                };
                window.addEventListener('resize', handleResize);

                // Animation loop
                let animId;
                const animate = (time) => {
                    animId = requestAnimationFrame(animate);
                    window.TWEEN.update(time);
                    controls.update();
                    renderer.render(scene, camera);
                };
                animate();

                return () => {
                    cancelAnimationFrame(animId);
                    window.removeEventListener('resize', handleResize);
                    renderer.dispose();
                };
            }, [screen]);

            // Model Pion 3D Pengrajin Bali
            const createPlayerPawnMesh = (colorHex, tokenChar) => {
                const group = new THREE.Group();

                // Basis Emas Beveled
                const baseGeo = new THREE.CylinderGeometry(0.7, 0.85, 0.35, 24);
                const baseMat = new THREE.MeshStandardMaterial({ color: 0xd97706, roughness: 0.25, metalness: 0.85 });
                const base = new THREE.Mesh(baseGeo, baseMat);
                base.castShadow = true;
                group.add(base);

                // Badan Pion Enamel Berwarna
                const bodyGeo = new THREE.CylinderGeometry(0.4, 0.65, 1.2, 24);
                const bodyMat = new THREE.MeshStandardMaterial({ color: colorHex, roughness: 0.2, metalness: 0.3 });
                const body = new THREE.Mesh(bodyGeo, bodyMat);
                body.position.y = 0.7;
                body.castShadow = true;
                group.add(body);

                // Kepala Pion Bulat
                const headGeo = new THREE.SphereGeometry(0.5, 24, 24);
                const head = new THREE.Mesh(headGeo, bodyMat);
                head.position.y = 1.45;
                head.castShadow = true;
                group.add(head);

                // Badge Karakter Mengambang di atas Kepala
                const canvas = document.createElement('canvas');
                canvas.width = 128;
                canvas.height = 128;
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = "rgba(15, 23, 42, 0.85)";
                ctx.beginPath();
                ctx.arc(64, 64, 58, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = "#f59e0b";
                ctx.lineWidth = 8;
                ctx.stroke();
                ctx.font = "64px sans-serif";
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.fillText(tokenChar, 64, 70);

                const badgeTex = new THREE.CanvasTexture(canvas);
                const badgeMat = new THREE.SpriteMaterial({ map: badgeTex });
                const sprite = new THREE.Sprite(badgeMat);
                sprite.position.y = 2.4;
                sprite.scale.set(1.4, 1.4, 1.4);
                group.add(sprite);

                return group;
            };

            // Animasi Lempar Dadu 3D dengan Rotasi Fisik & Pantulan
            const roll3DDice = (d1, d2, onComplete) => {
                const dice = diceMeshesRef.current;
                if (!dice || dice.length < 2) {
                    onComplete();
                    return;
                }

                setIsRolling(true);
                playSoundEffect('dice');

                // Pemetaan rotasi agar muka dadu menghadap ke atas
                // Muka atas Three.js adalah sumbu +Y (index material 2)
                const faceRotations = {
                    1: { x: 0, z: Math.PI / 2 },
                    2: { x: 0, z: 0 },
                    3: { x: -Math.PI / 2, z: 0 },
                    4: { x: Math.PI / 2, z: 0 },
                    5: { x: Math.PI, z: 0 },
                    6: { x: 0, z: -Math.PI / 2 }
                };

                const targetRot1 = faceRotations[d1] || { x: 0, z: 0 };
                const targetRot2 = faceRotations[d2] || { x: 0, z: 0 };

                dice.forEach((die, i) => {
                    const isLeft = i === 0;
                    die.position.set(isLeft ? -4 : 4, 8, isLeft ? 3 : -3);
                    
                    // Rotasi berputar acak di udara
                    const targetRot = isLeft ? targetRot1 : targetRot2;
                    const fullSpins = (Math.PI * 2) * 3;

                    new window.TWEEN.Tween(die.position)
                        .to({ y: 2.3, x: isLeft ? -1.8 : 1.8, z: 0 }, 750)
                        .easing(window.TWEEN.Easing.Bounce.Out)
                        .start();

                    new window.TWEEN.Tween(die.rotation)
                        .to({
                            x: targetRot.x + fullSpins,
                            y: fullSpins + (Math.random() * 0.5),
                            z: targetRot.z + fullSpins
                        }, 750)
                        .easing(window.TWEEN.Easing.Cubic.Out)
                        .onComplete(() => {
                            if (i === 1) {
                                setIsRolling(false);
                                onComplete();
                            }
                        })
                        .start();
                });
            };

            // Animasi Lompat Bidak 3D secara Parabola dari Petak ke Petak
            const animatePawnMovement = (playerId, fromPos, steps, onComplete) => {
                const pawn = playerMeshesRef.current[playerId];
                if (!pawn) {
                    onComplete();
                    return;
                }

                setIsMoving(true);
                let currentStep = 0;

                const stepNext = () => {
                    if (currentStep >= steps) {
                        setIsMoving(false);
                        onComplete();
                        return;
                    }

                    currentStep++;
                    const nextTileId = (fromPos + currentStep) % 40;
                    const targetCoords = getTileCoordinates(nextTileId);
                    const startX = pawn.position.x;
                    const startZ = pawn.position.z;
                    const jumpHeight = 2.8;

                    playSoundEffect('hop');

                    const startTime = performance.now();
                    const duration = 280;

                    const hopAnim = (now) => {
                        const elapsed = now - startTime;
                        const progress = Math.min(elapsed / duration, 1);

                        // Interpolasi Linear X & Z
                        pawn.position.x = startX + (targetCoords.x - startX) * progress;
                        pawn.position.z = startZ + (targetCoords.z - startZ) * progress;

                        // Kurva Parabola Y
                        pawn.position.y = 1.6 + Math.sin(progress * Math.PI) * jumpHeight;

                        if (progress < 1) {
                            requestAnimationFrame(hopAnim);
                        } else {
                            pawn.position.y = 1.6;
                            setTimeout(stepNext, 50);
                        }
                    };

                    requestAnimationFrame(hopAnim);
                };

                stepNext();
            };

            // Lempar Dadu & Gerakkan Bidak Otomatis
            const handleRollDice = () => {
                if (isRolling || isMoving || turnPhase !== 'ROLL') return;

                const d1 = Math.floor(Math.random() * 6) + 1;
                const d2 = Math.floor(Math.random() * 6) + 1;
                const total = d1 + d2;
                const isDouble = d1 === d2;

                setCurrentRoll([d1, d2]);

                roll3DDice(d1, d2, () => {
                    addLog(`${currentPlayer.name} melempar dadu: ${d1} & ${d2} (Total: ${total})${isDouble ? ' • Dadu Kembar!' : ''}`);

                    // Jalankan pergerakan 3D otomatis tanpa dialog konfirmasi
                    const startPos = currentPlayer.position;
                    animatePawnMovement(currentPlayer.id, startPos, total, () => {
                        const finalPos = (startPos + total) % 40;
                        updatePlayer(currentPlayer.id, { position: finalPos });

                        // Tangani bonus GO jika melewati atau mendarat tepat
                        if (startPos + total >= 40) {
                            const bonus = finalPos === 0 ? 30000 : 20000;
                            adjustPlayerMoney(currentPlayer.id, bonus);
                            addLog(`${currentPlayer.name} ${finalPos === 0 ? 'berhenti tepat di' : 'melewati'} GO, menerima Rp ${bonus.toLocaleString('id-ID')}.`);
                        }

                        // Aksi petak tujuan
                        handleTileAction(finalPos, isDouble);
                    });
                });
            };

            // Logika Aksi Petak
            const handleTileAction = (tileId, isDouble) => {
                const space = board[tileId];
                if (!space) return;

                if (space.type === 'property' || space.type === 'port' || space.type === 'utility') {
                    if (space.owner === undefined) {
                        // Belum dimiliki
                        if (currentPlayer.isBot) {
                            // Bot otomatis beli jika saldo cukup
                            if (currentPlayer.money >= space.price + 20000) {
                                buyProperty(space, currentPlayer.id);
                            } else {
                                addLog(`${currentPlayer.name} melewati ${space.name}.`);
                            }
                            finishTurnAction(isDouble);
                        } else {
                            setSelectedActionSpace(space);
                            setTurnPhase('ACTION');
                        }
                    } else if (space.owner !== currentPlayer.id) {
                        // Milik lawan -> Bayar Sewa
                        const owner = players[space.owner];
                        let rent = space.rent || 1000;
                        if (touristSeasonTurns > 0 && [1, 26, 29].includes(space.id)) {
                            rent *= 2; // Musim Liburan Turis Aktif
                        }
                        adjustPlayerMoney(currentPlayer.id, -rent);
                        adjustPlayerMoney(owner.id, rent);
                        addLog(`${currentPlayer.name} membayar sewa Rp ${rent.toLocaleString('id-ID')} kepada ${owner.name} di ${space.name}.`);
                        finishTurnAction(isDouble);
                    } else {
                        // Milik sendiri
                        if (space.type === 'property' && (space.houses || 0) < 4 && currentPlayer.money >= 15000) {
                            if (currentPlayer.isBot && currentPlayer.money >= 35000) {
                                buildHouse(space.id);
                            }
                        }
                        finishTurnAction(isDouble);
                    }
                } else if (space.type === 'chance' || space.type === 'chest') {
                    const deck = space.type === 'chance' ? chanceCards : chestCards;
                    const card = deck[Math.floor(Math.random() * deck.length)];
                    setActiveCard(card);
                    setTurnPhase('CARD');
                    addLog(`Kartu: ${card.text}`);
                    if (currentPlayer.isBot) {
                        setTimeout(() => applyCard(card, isDouble), 2000);
                    }
                } else if (space.type === 'tax') {
                    adjustPlayerMoney(currentPlayer.id, -space.price);
                    setFreeParkingPot(prev => prev + space.price);
                    addLog(`${currentPlayer.name} membayar pajak Rp ${space.price.toLocaleString('id-ID')} ke kas Parkir Bebas.`);
                    finishTurnAction(isDouble);
                } else if (space.type === 'parking') {
                    if (freeParkingPot > 0) {
                        adjustPlayerMoney(currentPlayer.id, freeParkingPot);
                        addLog(`${currentPlayer.name} mengambil Jackpot Parkir Bebas Rp ${freeParkingPot.toLocaleString('id-ID')}!`);
                        setFreeParkingPot(0);
                    }
                    finishTurnAction(isDouble);
                } else if (space.type === 'gotojail') {
                    sendToJail(currentPlayer.id);
                    finishTurnAction(false);
                } else {
                    finishTurnAction(isDouble);
                }
            };

            const buyProperty = (space, buyerId) => {
                adjustPlayerMoney(buyerId, -space.price);
                setBoard(prev => prev.map(s => s.id === space.id ? { ...s, owner: buyerId } : s));
                addLog(`${players[buyerId].name} membeli ${space.name} seharga Rp ${space.price.toLocaleString('id-ID')}.`);
            };

            const buildHouse = (spaceId) => {
                setBoard(prev => prev.map(s => s.id === spaceId ? { ...s, houses: (s.houses || 0) + 1 } : s));
                adjustPlayerMoney(currentPlayer.id, -10000);
                addLog(`${currentPlayer.name} membangun rumah di ${board[spaceId].name}!`);
            };

            const applyCard = (card, isDouble) => {
                if (card.action === 'tourist_season') {
                    setTouristSeasonTurns(players.length * 2);
                    addLog(`🌴 EVENT AKTIF: Musim Liburan Turis! Sewa Kuta, Seminyak, Canggu melonjak 2x lipat!`);
                } else if (card.action === 'money') {
                    adjustPlayerMoney(currentPlayer.id, card.amount);
                } else if (card.action === 'move') {
                    const pawn = playerMeshesRef.current[currentPlayer.id];
                    if (pawn) {
                        const coords = getTileCoordinates(card.target);
                        pawn.position.set(coords.x, 1.6, coords.z);
                    }
                    updatePlayer(currentPlayer.id, { position: card.target });
                } else if (card.action === 'jail') {
                    sendToJail(currentPlayer.id);
                    setActiveCard(null);
                    finishTurnAction(false);
                    return;
                }
                setActiveCard(null);
                finishTurnAction(isDouble);
            };

            const sendToJail = (playerId) => {
                updatePlayer(playerId, { position: 10, inJail: true, jailTurns: 0 });
                const pawn = playerMeshesRef.current[playerId];
                if (pawn) {
                    const coords = getTileCoordinates(10);
                    pawn.position.set(coords.x, 1.6, coords.z);
                }
                addLog(`${players[playerId].name} dijebloskan ke Penjara Kerobokan!`);
            };

            const finishTurnAction = (isDouble) => {
                setSelectedActionSpace(null);
                if (isDouble) {
                    setTurnPhase('ROLL');
                    addLog(`Dadu kembar! ${currentPlayer.name} mendapat giliran tambahan.`);
                } else {
                    setTurnPhase('END');
                }
            };

            const endTurn = () => {
                // Cek Kemenangan
                const active = players.filter(p => !p.bankrupt);
                if (active.length <= 1) {
                    setWinner(active[0] || currentPlayer);
                    setTurnPhase('WIN');
                    return;
                }

                setTouristSeasonTurns(prev => Math.max(0, prev - 1));
                setTotalTurnsCount(prev => prev + 1);

                let nextIndex = (turnIndex + 1) % players.length;
                while (players[nextIndex].bankrupt) {
                    nextIndex = (nextIndex + 1) % players.length;
                }

                setTurnIndex(nextIndex);
                setTurnPhase('ROLL');
                addLog(`Giliran berganti ke ${players[nextIndex].name}.`);
            };

            // Pewaktu Otomatis Akhiri Giliran 5 Detik
            React.useEffect(() => {
                if (turnPhase !== 'END') {
                    setAutoEndCountdown(5);
                    return;
                }

                setAutoEndCountdown(5);
                const timer = setInterval(() => {
                    setAutoEndCountdown(prev => Math.max(0, prev - 1));
                }, 1000);

                const timeout = setTimeout(() => {
                    endTurn();
                }, 5000);

                return () => {
                    clearInterval(timer);
                    clearTimeout(timeout);
                };
            }, [turnPhase, turnIndex]);

            // Eksekusi Bot Otomatis
            React.useEffect(() => {
                if (screen !== 'GAME' || !currentPlayer.isBot || isRolling || isMoving) return;

                if (turnPhase === 'ROLL') {
                    const delay = setTimeout(() => handleRollDice(), 1200);
                    return () => clearTimeout(delay);
                } else if (turnPhase === 'END') {
                    const delay = setTimeout(() => endTurn(), 1000);
                    return () => clearTimeout(delay);
                }
            }, [turnPhase, turnIndex, screen, isRolling, isMoving]);

            const updatePlayer = (id, changes) => {
                setPlayers(prev => prev.map(p => p.id === id ? { ...p, ...changes } : p));
            };

            const adjustPlayerMoney = (id, amount) => {
                setPlayers(prev => prev.map(p => {
                    if (p.id !== id) return p;
                    const newMoney = p.money + amount;
                    if (newMoney < 0) {
                        return { ...p, money: 0, bankrupt: true };
                    }
                    return { ...p, money: newMoney };
                }));
            };

            const startGame = () => {
                const initPlayers = players.map(p => ({
                    ...p,
                    money: startingMoney,
                    position: 0,
                    inJail: false,
                    bankrupt: false
                }));
                setPlayers(initPlayers);
                setTurnIndex(0);
                setTurnPhase('ROLL');
                setTotalTurnsCount(1);
                setTouristSeasonTurns(0);
                setScreen('GAME');
            };

            // Kamera Presets
            const setCameraView = (type) => {
                const cam = threeSceneRef.current?.camera;
                const ctrl = threeSceneRef.current?.controls;
                if (!cam || !ctrl) return;

                if (type === 'orbit') {
                    new window.TWEEN.Tween(cam.position).to({ x: 0, y: 34, z: 32 }, 600).start();
                    ctrl.target.set(0, 0, 0);
                } else if (type === 'top') {
                    new window.TWEEN.Tween(cam.position).to({ x: 0, y: 48, z: 0.1 }, 600).start();
                    ctrl.target.set(0, 0, 0);
                } else if (type === 'pawn') {
                    const pawn = playerMeshesRef.current[currentPlayer.id];
                    if (pawn) {
                        new window.TWEEN.Tween(cam.position).to({
                            x: pawn.position.x + 8,
                            y: pawn.position.y + 12,
                            z: pawn.position.z + 12
                        }, 600).start();
                        ctrl.target.copy(pawn.position);
                    }
                }
            };

            // Hitung Total Kekayaan Pemain
            const calcNetWorth = (p) => {
                const assets = board.filter(s => s.owner === p.id);
                const assetVal = assets.reduce((sum, s) => sum + (s.price || 0) + ((s.houses || 0) * 10000), 0);
                return p.money + assetVal;
            };

            // --- RENDER LAYAR LOBBY ---
            if (screen === 'LOBBY') {
                return (
                    <div className="w-full h-full flex items-center justify-center p-4 bg-gradient-to-br from-slate-950 via-slate-900 to-emerald-950 text-white">
                        <div className="max-w-2xl w-full bg-slate-900/90 border border-emerald-500/40 rounded-2xl p-6 shadow-2xl backdrop-blur-md">
                            <div className="text-center mb-6">
                                <span className="px-3 py-1 bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 rounded-full text-xs font-black tracking-widest uppercase">
                                    WebGL 3D Edition
                                </span>
                                <h1 className="text-4xl font-black mt-2 text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 via-amber-300 to-emerald-200">
                                    MONOPOLI BALI 3D
                                </h1>
                                <p className="text-xs text-slate-400 mt-1">Rasakan sensasi papan 3D, dadu fisik, dan bidak melompat nyata</p>
                            </div>

                            {/* Opsi Modal Awal */}
                            <div className="bg-slate-800/80 border border-slate-700 rounded-xl p-4 mb-5">
                                <span className="text-xs font-black uppercase text-amber-400 block mb-2">Pilihan Modal Awal:</span>
                                <div className="grid grid-cols-3 gap-3">
                                    {[
                                        { label: "⚡ Cepat", val: 100000, desc: "Rp 100.000" },
                                        { label: "⭐ Standar", val: 150000, desc: "Rp 150.000" },
                                        { label: "👑 Sultan", val: 250000, desc: "Rp 250.000" }
                                    ].map(item => (
                                        <button
                                            key={item.val}
                                            onClick={() => setStartingMoney(item.val)}
                                            className={`p-2.5 rounded-lg font-black text-xs transition-all border text-center ${startingMoney === item.val ? 'bg-emerald-600 text-white border-emerald-400 shadow-lg scale-105' : 'bg-slate-900/80 text-slate-300 border-slate-700 hover:bg-slate-700'}`}
                                        >
                                            {item.label}<br/><span className="text-[0.65rem] font-normal opacity-80">{item.desc}</span>
                                        </button>
                                    ))}
                                </div>
                            </div>

                            {/* Daftar Pemain */}
                            <div className="space-y-3 mb-6">
                                <div className="flex justify-between items-center text-xs font-bold text-slate-300 mb-1">
                                    <span>DAFTAR PEMAIN ({players.length}/6):</span>
                                    <button 
                                        onClick={() => {
                                            if (players.length < 6) {
                                                const id = players.length;
                                                const nextToken = tokenChoices[id % tokenChoices.length];
                                                const nextColor = playerColors[id % playerColors.length];
                                                setPlayers(prev => [...prev, { id, name: `Bot ${id}`, token: nextToken, color: nextColor, money: startingMoney, position: 0, isBot: true, inJail: false, jailTurns: 0 }]);
                                            }
                                        }}
                                        className="text-emerald-400 hover:text-emerald-300 font-black"
                                    >
                                        + Tambah Bot AI
                                    </button>
                                </div>
                                {players.map((p, idx) => (
                                    <div key={p.id} className="flex items-center gap-3 bg-slate-800/60 border border-slate-700 p-2.5 rounded-xl">
                                        <span className="w-8 h-8 rounded-lg flex items-center justify-center text-lg font-bold text-white shadow" style={{ backgroundColor: p.color }}>
                                            {p.token}
                                        </span>
                                        <input
                                            value={p.name}
                                            onChange={(e) => {
                                                const val = e.target.value;
                                                setPlayers(prev => prev.map(pl => pl.id === p.id ? { ...pl, name: val } : pl));
                                            }}
                                            className="bg-transparent border-b border-slate-600 focus:border-emerald-400 outline-none text-sm font-bold flex-1 px-1"
                                        />
                                        <span className="text-xs px-2 py-0.5 rounded bg-slate-700 text-slate-300 font-semibold">
                                            {p.isBot ? "Bot AI" : "Manusia"}
                                        </span>
                                        {idx > 1 && (
                                            <button 
                                                onClick={() => setPlayers(prev => prev.filter(pl => pl.id !== p.id))}
                                                className="text-red-400 hover:text-red-300 text-xs font-bold px-1"
                                            >
                                                ✕
                                            </button>
                                        )}
                                    </div>
                                ))}
                            </div>

                            <button
                                onClick={startGame}
                                className="w-full bg-gradient-to-r from-emerald-600 to-teal-500 hover:from-emerald-500 hover:to-teal-400 text-white font-black py-4 rounded-xl shadow-xl transition-all transform hover:scale-[1.02] active:scale-95 text-base uppercase tracking-wider"
                            >
                                🚀 Masuk Arena 3D
                            </button>
                        </div>
                    </div>
                );
            }

            // --- RENDER LAYAR GAME 3D & HUD OVERLAY ---
            return (
                <div className="w-full h-full relative overflow-hidden bg-slate-950">
                    {/* Wadah Tampilan WebGL Three.js */}
                    <div id="canvas3d-container" className="w-full h-full absolute inset-0 cursor-grab active:cursor-grabbing"></div>

                    {/* HUD OVERLAY 2D */}
                    <div id="ui-overlay">
                        {/* Top Bar Status */}
                        <div className="p-4 flex items-start justify-between">
                            {/* Giliran Pemain & Info Saldo */}
                            <div className="interactive glass-panel rounded-2xl p-3.5 border-l-4 text-white flex items-center gap-3.5" style={{ borderLeftColor: currentPlayer.color }}>
                                <div className="text-3xl p-1.5 rounded-xl bg-slate-800/80 shadow">
                                    {currentPlayer.token}
                                </div>
                                <div>
                                    <div className="flex items-center gap-2">
                                        <span className="text-xs font-black tracking-wider uppercase text-slate-300">
                                            Giliran #{totalTurnsCount}:
                                        </span>
                                        <span className="font-extrabold text-sm text-amber-300">
                                            {currentPlayer.name} {currentPlayer.isBot ? '(Bot AI)' : ''}
                                        </span>
                                    </div>
                                    <div className="text-lg font-black text-emerald-400">
                                        Rp {currentPlayer.money.toLocaleString('id-ID')}
                                    </div>
                                </div>
                            </div>

                            {/* Tombol Kamera & Kontrol Audio */}
                            <div className="interactive flex flex-col items-end gap-2">
                                <div className="glass-panel px-3 py-1.5 rounded-full flex items-center gap-2 text-xs font-bold text-white shadow-xl">
                                    <button 
                                        onClick={() => setIsSfxMuted(!isSfxMuted)} 
                                        className={`px-2 py-0.5 rounded-full text-xs font-black ${isSfxMuted ? 'text-red-400' : 'text-emerald-400'}`}
                                    >
                                        {isSfxMuted ? "🔇 SFX" : "🎲 SFX"}
                                    </button>
                                    <div className="h-3 w-px bg-white/20"></div>
                                    <span className="text-[0.7rem] text-slate-300">🎵</span>
                                    <input 
                                        type="range" min="0" max="1" step="0.05" value={musicVolume} 
                                        onChange={(e) => setMusicVolume(parseFloat(e.target.value))} 
                                        className="w-14 h-1 accent-emerald-400 cursor-pointer"
                                    />
                                </div>

                                {/* Kamera Switcher */}
                                <div className="glass-panel p-1 rounded-xl flex gap-1 text-[0.72rem] font-bold text-white">
                                    <button onClick={() => setCameraView('orbit')} className="px-2.5 py-1 rounded-lg bg-slate-800/90 hover:bg-slate-700">
                                        🎥 3D Bebas
                                    </button>
                                    <button onClick={() => setCameraView('top')} className="px-2.5 py-1 rounded-lg bg-slate-800/90 hover:bg-slate-700">
                                        🗺️ Top-Down
                                    </button>
                                    <button onClick={() => setCameraView('pawn')} className="px-2.5 py-1 rounded-lg bg-slate-800/90 hover:bg-slate-700">
                                        🎯 Fokus Bidak
                                    </button>
                                </div>
                            </div>
                        </div>

                        {/* Banner Event Musiman */}
                        {touristSeasonTurns > 0 && (
                            <div className="self-center glass-panel px-4 py-1.5 rounded-full border border-amber-400/50 shadow-2xl flex items-center gap-2 text-white animate-bounce">
                                <span className="text-base">🌴</span>
                                <span className="text-xs font-black text-amber-300 tracking-wide">
                                    MUSIM LIBURAN TURIS AKTIF! Sewa Kuta, Seminyak, Canggu 2x Lipat (Sisa {touristSeasonTurns} giliran)
                                </span>
                            </div>
                        )}

                        {/* Modal Beli Properti (Action Phase) */}
                        {turnPhase === 'ACTION' && selectedActionSpace && canTakeAction && (
                            <div className="self-center interactive animate-pop-in glass-panel rounded-2xl p-5 border-2 max-w-sm w-full mx-4 text-white text-center shadow-2xl" style={{ borderColor: selectedActionSpace.color || '#10b981' }}>
                                <div className="text-xs font-black uppercase tracking-wider text-slate-300 mb-1">Peluang Investasi</div>
                                <h3 className="text-2xl font-black mb-2" style={{ color: selectedActionSpace.color || '#fff' }}>
                                    {selectedActionSpace.name}
                                </h3>
                                <p className="text-xs text-slate-300 italic mb-4">"{selectedActionSpace.desc}"</p>
                                <div className="bg-slate-800/80 rounded-xl p-3 mb-4 flex justify-between text-xs font-bold">
                                    <span className="text-slate-400">Harga Beli:</span>
                                    <span className="text-emerald-400 text-sm font-black">Rp {selectedActionSpace.price.toLocaleString('id-ID')}</span>
                                </div>
                                <div className="grid grid-cols-2 gap-3">
                                    <button 
                                        onClick={() => finishTurnAction(false)} 
                                        className="py-2.5 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl font-black text-xs shadow"
                                    >
                                        Lewati
                                    </button>
                                    <button 
                                        onClick={() => {
                                            buyProperty(selectedActionSpace, currentPlayer.id);
                                            finishTurnAction(false);
                                        }} 
                                        disabled={currentPlayer.money < selectedActionSpace.price}
                                        className="py-2.5 bg-gradient-to-r from-emerald-600 to-teal-500 hover:from-emerald-500 text-white rounded-xl font-black text-xs shadow disabled:opacity-50"
                                    >
                                        Beli Kavling
                                    </button>
                                </div>
                            </div>
                        )}

                        {/* Modal Kartu Kesempatan / Dana Punia */}
                        {turnPhase === 'CARD' && activeCard && (
                            <div className="self-center interactive animate-pop-in glass-panel rounded-2xl p-5 border-2 border-amber-400 max-w-sm w-full mx-4 text-white text-center shadow-2xl">
                                <div className="text-4xl mb-2">🎁</div>
                                <h3 className="text-xl font-black text-amber-300 uppercase mb-2">Kartu Peristiwa</h3>
                                <p className="text-sm font-semibold text-slate-200 mb-4 bg-slate-800/60 p-3 rounded-xl border border-slate-700">
                                    {activeCard.text}
                                </p>
                                {canTakeAction && (
                                    <button 
                                        onClick={() => applyCard(activeCard, false)} 
                                        className="w-full py-3 bg-gradient-to-r from-blue-600 to-indigo-600 text-white rounded-xl font-black text-xs shadow uppercase tracking-wider"
                                    >
                                        Lanjutkan
                                    </button>
                                )}
                            </div>
                        )}

                        {/* Bottom Bar: Kontrol Lempar Dadu & Akhiri Giliran */}
                        <div className="p-4 flex items-end justify-between">
                            {/* Log Riwayat */}
                            <div className="interactive glass-panel rounded-2xl p-3 w-72 max-h-36 overflow-y-auto text-[0.72rem] text-slate-300 space-y-1 shadow-lg">
                                <div className="font-black text-slate-400 uppercase text-[0.65rem] border-b border-slate-700 pb-1 mb-1">
                                    Catatan Pertandingan
                                </div>
                                {logs.slice(0, 5).map((l, i) => (
                                    <div key={i} className="leading-tight opacity-90">{l}</div>
                                ))}
                            </div>

                            {/* Tombol Utama Giliran */}
                            <div className="interactive flex flex-col items-center gap-2">
                                {turnPhase === 'ROLL' && canTakeAction && (
                                    <button
                                        onClick={handleRollDice}
                                        disabled={isRolling || isMoving}
                                        className="bg-gradient-to-r from-amber-500 via-yellow-400 to-amber-600 hover:from-amber-400 hover:to-yellow-300 text-slate-950 px-8 py-3.5 rounded-full font-black text-base shadow-2xl transition-all transform hover:scale-105 active:scale-95 disabled:opacity-50 border-2 border-white flex items-center gap-2 animate-bounce"
                                    >
                                        <span>🎲</span>
                                        <span>LEMPAR DADU 3D</span>
                                    </button>
                                )}

                                {turnPhase === 'END' && canTakeAction && (
                                    <button
                                        onClick={endTurn}
                                        className="bg-gradient-to-r from-red-600 to-rose-600 hover:from-red-500 text-white px-8 py-3.5 rounded-full font-black text-sm shadow-2xl transition-all transform hover:scale-105 active:scale-95 border-2 border-white flex items-center gap-2"
                                    >
                                        <span>🛑 Akhiri Giliran</span>
                                        <span className="bg-red-950/70 px-2 py-0.5 rounded-full font-mono text-xs text-red-200">
                                            {autoEndCountdown}s
                                        </span>
                                    </button>
                                )}

                                {currentPlayer.isBot && (
                                    <div className="glass-panel px-4 py-2 rounded-full text-xs font-bold text-emerald-300 flex items-center gap-2">
                                        <span className="animate-spin">⚙️</span>
                                        <span>{currentPlayer.name} sedang berpikir &amp; melangkah...</span>
                                    </div>
                                )}
                            </div>

                            {/* Info Kas Parkir Bebas */}
                            <div className="interactive glass-panel rounded-2xl p-3 text-right text-white">
                                <span className="text-[0.65rem] font-black uppercase text-amber-400 block">Jackpot Parkir</span>
                                <span className="text-base font-black text-emerald-400">
                                    Rp {freeParkingPot.toLocaleString('id-ID')}
                                </span>
                            </div>
                        </div>

                        {/* Modal Game Over / Leaderboard Kemenangan */}
                        {turnPhase === 'WIN' && winner && (
                            <div className="absolute inset-0 bg-slate-950/80 backdrop-blur-md z-50 flex items-center justify-center p-4 interactive">
                                <div className="glass-panel max-w-lg w-full rounded-2xl border-2 border-amber-400 p-6 text-white text-center shadow-2xl animate-pop-in">
                                    <div className="text-5xl mb-2 animate-bounce">🏆</div>
                                    <div className="text-xs font-black uppercase text-amber-400 tracking-widest">Pertandingan Berakhir</div>
                                    <h2 className="text-3xl font-black mb-4 text-amber-300">{winner.token} {winner.name} Sang Juara!</h2>

                                    {/* 3 Statistik Utama */}
                                    <div className="grid grid-cols-3 gap-2 mb-4 text-center">
                                        <div className="bg-slate-800/80 p-2.5 rounded-xl border border-slate-700">
                                            <span className="text-[0.65rem] text-slate-400 block">Total Putaran</span>
                                            <span className="text-lg font-black text-amber-400">{totalTurnsCount}</span>
                                        </div>
                                        <div className="bg-slate-800/80 p-2.5 rounded-xl border border-slate-700">
                                            <span className="text-[0.65rem] text-slate-400 block">Raja Properti</span>
                                            <span className="text-xs font-black text-emerald-400 truncate block">
                                                {[...players].sort((a,b) => board.filter(s=>s.owner===b.id).length - board.filter(s=>s.owner===a.id).length)[0]?.name}
                                            </span>
                                        </div>
                                        <div className="bg-slate-800/80 p-2.5 rounded-xl border border-slate-700">
                                            <span className="text-[0.65rem] text-slate-400 block">Pemain Terkaya</span>
                                            <span className="text-xs font-black text-blue-400 truncate block">
                                                {[...players].sort((a,b) => calcNetWorth(b) - calcNetWorth(a))[0]?.name}
                                            </span>
                                        </div>
                                    </div>

                                    {/* Tabel Leaderboard */}
                                    <div className="bg-slate-800/50 rounded-xl overflow-hidden border border-slate-700 text-left mb-5">
                                        <div className="bg-slate-800 px-3 py-1.5 text-[0.7rem] font-black uppercase text-slate-400 flex justify-between">
                                            <span>Peringkat</span>
                                            <span>Total Nilai Aset</span>
                                        </div>
                                        <div className="divide-y divide-slate-700/50">
                                            {[...players].sort((a, b) => calcNetWorth(b) - calcNetWorth(a)).map((p, idx) => (
                                                <div key={p.id} className="p-2.5 flex items-center justify-between text-xs">
                                                    <div className="flex items-center gap-2">
                                                        <span className="w-5 h-5 rounded-full bg-slate-700 flex items-center justify-center font-bold text-[0.65rem]">
                                                            #{idx + 1}
                                                        </span>
                                                        <span className="text-base">{p.token}</span>
                                                        <div>
                                                            <span className="font-bold block leading-tight">{p.name}</span>
                                                            <span className="text-[0.65rem] text-slate-400">
                                                                {p.bankrupt ? '💀 Bangkrut' : `${board.filter(s=>s.owner===p.id).length} Kavling`}
                                                            </span>
                                                        </div>
                                                    </div>
                                                    <div className="text-right">
                                                        <span className="font-black text-emerald-400 block">
                                                            Rp {calcNetWorth(p).toLocaleString('id-ID')}
                                                        </span>
                                                        <span className="text-[0.65rem] text-slate-400">
                                                            Kas: Rp {p.money.toLocaleString('id-ID')}
                                                        </span>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    </div>

                                    <div className="grid grid-cols-2 gap-3">
                                        <button onClick={() => setScreen('LOBBY')} className="py-3 bg-slate-800 hover:bg-slate-700 rounded-xl font-black text-xs uppercase shadow">
                                            Lobby Utama
                                        </button>
                                        <button onClick={startGame} className="py-3 bg-gradient-to-r from-emerald-600 to-teal-500 rounded-xl font-black text-xs uppercase shadow">
                                            Main Lagi
                                        </button>
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
